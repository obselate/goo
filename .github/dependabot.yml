version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/Goo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "dotnet-ilverify"
        versions: ["[11.0.0,)"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
