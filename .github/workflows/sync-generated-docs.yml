name: Sync generated docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-generated-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        run: ./bootstrap.sh --gsharp-only

      - name: Regenerate documentation
        run: |
          dotnet build tests/Goo.ApiContractTests/Goo.ApiContractTests.gsproj -c Release -p:TreatWarningsAsErrors=true
          dotnet build tools/Goo.ApiDocs/Goo.ApiDocs.gsproj -c Release
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          for project in sorted(Path('.').glob('Goo*/*.gsproj')):
              xml = project.parent / 'bin' / 'Release' / 'net10.0' / f'{project.stem}.xml'
              if not xml.is_file():
                  continue
              package = project.stem.removeprefix('Goo.')
              slug = re.sub(r'([a-z0-9])([A-Z])', r'\1-\2', package).lower()
              output = 'docs/api' if project.stem == 'Goo' else f'docs/api-{slug}'
              subprocess.run([
                  'dotnet', 'tools/Goo.ApiDocs/bin/Release/net10.0/Goo.ApiDocs.dll',
                  '--source', str(project.parent), '--xml', str(xml), '--output', output,
              ], check=True)
          PY
          rm -rf docs/api-gestures docs/api-images docs/api-native-menus docs/api-native-dialogs \
            docs/api-notifications docs/api-printing docs/api-spell-check docs/api-spell-check.hunspell
          dotnet run --project tools/Goo.SyncDocs/Goo.SyncDocs.gsproj -c Release -- .

      - name: Commit generated documentation
        run: |
          git add -A -- 'docs/api*' plugins/goo/reference
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync generated docs"
          git push origin HEAD:main
