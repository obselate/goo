name: Sync generated docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-generated-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        run: ./bootstrap.sh --gsharp-only

      - name: Build Android documentation target
        run: |
          dotnet workload install android
          dotnet build Goo.Android/Goo.Android.gsproj -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:TreatWarningsAsErrors=true

      - name: Regenerate documentation
        run: |
          dotnet build tests/Goo.ApiContractTests/Goo.ApiContractTests.gsproj -c Release -p:TreatWarningsAsErrors=true
          dotnet build tools/Goo.ApiDocs/Goo.ApiDocs.gsproj -c Release
          for project in Goo*/*.gsproj; do
            name="$(basename "$project" .gsproj)"
            source="$(dirname "$project")"
            xml="$source/bin/Release/net10.0/$name.xml"
            if [ "$name" = Goo.Android ]; then xml="$source/bin/Release/net10.0-android/$name.xml"; fi
            test -f "$xml" || continue
            slug="$(printf '%s' "${name#Goo.}" | sed -E 's/([a-z0-9])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')"
            output="docs/api-$slug"
            if [ "$name" = Goo ]; then output=docs/api; fi
            dotnet tools/Goo.ApiDocs/bin/Release/net10.0/Goo.ApiDocs.dll \
              --source "$source" --xml "$xml" --output "$output"
          done
          rm -rf docs/api-gestures docs/api-images docs/api-native-menus docs/api-native-dialogs \
            docs/api-notifications docs/api-printing docs/api-spell-check docs/api-spell-check.hunspell docs/api-app-host docs/api-rich-text
          dotnet run --project tools/Goo.SyncDocs/Goo.SyncDocs.gsproj -c Release -- .

      - name: Commit generated documentation
        run: |
          git add -A -- 'docs/api*' plugins/goo/reference
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync generated docs"
          git push origin HEAD:main
