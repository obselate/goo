name: Windows clipboard proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-clipboard:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b995ad91df302051930f1fba40b8ade867584da3
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Fetch pinned SDL
        shell: bash
        run: .github/scripts/fetch-sdl-win-x64.sh artifacts/SDL3.dll
      - name: Install software Vulkan
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          install_lavapipe: true
          cache: true
          github_token: ${{ github.token }}
      - name: Enable Vulkan runtime
        shell: pwsh
        run: |
          (Join-Path $env:VULKAN_SDK "runtime\x64") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build exact fix as NativeAOT
        shell: pwsh
        run: |
          $sdl = (Resolve-Path artifacts/SDL3.dll).Path
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:GooUseProjectReference=true -p:GooWindowsSdlPath="$sdl" --configfile NuGet.Config -o artifacts/windows-smoke -m:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check NativeAOT MIME snapshot
        shell: pwsh
        run: |
          $env:GOO_CLIPBOARD_DATA_SMOKE = "1"
          & artifacts/windows-smoke/Goo.PackageSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GOO_CLIPBOARD_DATA_SMOKE
      - name: Check Windows formats and source exit
        shell: pwsh
        run: |
          $env:GOO_CLIPBOARD_CHILD = (Resolve-Path artifacts/windows-smoke/Goo.PackageSmoke.exe).Path
          $sdl = (Resolve-Path artifacts/SDL3.dll).Path
          dotnet test tests/Goo.ApiContractTests/Goo.ApiContractTests.csproj -c Release -p:GooWindowsSdlPath="$sdl" --filter FullyQualifiedName~WindowsClipboardTests --logger "console;verbosity=normal" -m:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
