name: OLE clipboard probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;
          using System.Threading;
          public class Probe {
            [ComVisible(true), ClassInterface(ClassInterfaceType.None)]
            public class Renderable : IDataObject {
              public IDataObject Source;
              public void GetData(ref FORMATETC f,out STGMEDIUM m) {Source.GetData(ref f,out m);}
              public void GetDataHere(ref FORMATETC f,ref STGMEDIUM m) {
                STGMEDIUM source; Source.GetData(ref f,out source);
                try {
                  var input=(IStream)Marshal.GetObjectForIUnknown(source.unionmember);
                  var output=(IStream)Marshal.GetObjectForIUnknown(m.unionmember);
                  try {STATSTG stat; input.Stat(out stat,1);input.Seek(0,0,IntPtr.Zero);input.CopyTo(output,stat.cbSize,IntPtr.Zero,IntPtr.Zero);}
                  finally {Marshal.ReleaseComObject(input);Marshal.ReleaseComObject(output);}
                } finally {ReleaseStgMedium(ref source);}
              }
              public int QueryGetData(ref FORMATETC f) {return Source.QueryGetData(ref f);}
              public int GetCanonicalFormatEtc(ref FORMATETC f,out FORMATETC o) {return Source.GetCanonicalFormatEtc(ref f,out o);}
              public void SetData(ref FORMATETC f,ref STGMEDIUM m,bool release) {Source.SetData(ref f,ref m,release);}
              public IEnumFORMATETC EnumFormatEtc(DATADIR d) {return Source.EnumFormatEtc(d);}
              public int DAdvise(ref FORMATETC f,ADVF flags,IAdviseSink sink,out int connection) {return Source.DAdvise(ref f,flags,sink,out connection);}
              public void DUnadvise(int connection) {Source.DUnadvise(connection);}
              public int EnumDAdvise(out IEnumSTATDATA e) {return Source.EnumDAdvise(out e);}
            }
            [DllImport("ole32.dll")] static extern int OleInitialize(IntPtr p);
            [DllImport("ole32.dll")] static extern void OleUninitialize();
            [DllImport("ole32.dll")] static extern int OleSetClipboard(IDataObject obj);
            [DllImport("ole32.dll")] static extern int OleGetClipboard(out IDataObject obj);
            [DllImport("ole32.dll")] static extern int OleFlushClipboard();
            [DllImport("ole32.dll")] static extern void ReleaseStgMedium(ref STGMEDIUM m);
            [DllImport("shell32.dll")] static extern int SHCreateDataObject(IntPtr folder, uint count, IntPtr children, IntPtr inner, ref Guid iid, out IDataObject obj);
            [DllImport("shlwapi.dll")] static extern IntPtr SHCreateMemStream(byte[] bytes, uint size);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern uint RegisterClipboardFormatW(string name);
            [DllImport("kernel32.dll")] static extern IntPtr GlobalAlloc(uint flags, UIntPtr size);
            [DllImport("kernel32.dll")] static extern UIntPtr GlobalSize(IntPtr memory);
            static void Inspect(IDataObject obj, string phase, short format) {
              var e=obj.EnumFormatEtc(DATADIR.DATADIR_GET);
              var arr=new FORMATETC[1]; var fetched=new int[1];
              while(e.Next(1,arr,fetched)==0) Console.WriteLine(phase+" enum format="+(ushort)arr[0].cfFormat+" tymed="+arr[0].tymed+" aspect="+arr[0].dwAspect+" index="+arr[0].lindex);
              Marshal.ReleaseComObject(e);
              foreach (var t in new[]{TYMED.TYMED_ISTREAM,TYMED.TYMED_HGLOBAL,TYMED.TYMED_ISTREAM|TYMED.TYMED_HGLOBAL}) {
                var f=new FORMATETC{cfFormat=format,dwAspect=DVASPECT.DVASPECT_CONTENT,lindex=-1,tymed=t};
                Console.WriteLine(phase+" query "+t+"="+obj.QueryGetData(ref f).ToString("X8"));
                try { STGMEDIUM m; obj.GetData(ref f,out m); Console.WriteLine(phase+" get "+t+"=OK actual="+m.tymed+(m.tymed==TYMED.TYMED_HGLOBAL ? " size="+GlobalSize(m.unionmember) : "")); ReleaseStgMedium(ref m); } catch(Exception ex) {Console.WriteLine(phase+" get "+t+"="+ex.HResult.ToString("X8"));}
                var target=new STGMEDIUM{tymed=TYMED.TYMED_ISTREAM,unionmember=SHCreateMemStream(null,0)};
                f.tymed=TYMED.TYMED_ISTREAM;
                try {obj.GetDataHere(ref f,ref target);Console.WriteLine(phase+" here=OK");} catch(Exception ex) {Console.WriteLine(phase+" here="+ex.HResult.ToString("X8"));}
                ReleaseStgMedium(ref target);
              }
            }
            public static void Run() {
              var thread=new Thread(()=>{
                Console.WriteLine("init="+OleInitialize(IntPtr.Zero).ToString("X8"));
                foreach(var kind in new[]{"wrapper"}) foreach(var size in new[]{5,0}) {
                  Console.WriteLine("KIND="+kind);
                  IDataObject obj; var iid=new Guid("0000010e-0000-0000-c000-000000000046");
                  Marshal.ThrowExceptionForHR(SHCreateDataObject(IntPtr.Zero,0,IntPtr.Zero,IntPtr.Zero,ref iid,out obj));
                  var format=unchecked((short)RegisterClipboardFormatW("application/x-goo-probe"));
                  var f=new FORMATETC{cfFormat=format,dwAspect=DVASPECT.DVASPECT_CONTENT,lindex=-1,tymed=TYMED.TYMED_ISTREAM};
                  var m=new STGMEDIUM{tymed=TYMED.TYMED_ISTREAM,unionmember=SHCreateMemStream(new byte[size],(uint)size)};
                  if(kind=="stream-end" || kind=="wrapper") {
                    var s=(IStream)Marshal.GetObjectForIUnknown(m.unionmember);
                    s.Seek(0,2,IntPtr.Zero);
                    Marshal.ReleaseComObject(s);
                  } else {
                    Marshal.Release(m.unionmember);
                    f.tymed=TYMED.TYMED_HGLOBAL;
                    m.tymed=TYMED.TYMED_HGLOBAL;
                    m.unionmember=GlobalAlloc(66,(UIntPtr)size);
                  }
                  obj.SetData(ref f,ref m,true);
                  if(kind=="wrapper") obj=new Renderable{Source=obj};
                  Inspect(obj,"source size="+size,format);
                  Console.WriteLine("set="+OleSetClipboard(obj).ToString("X8"));
                  IDataObject before; Marshal.ThrowExceptionForHR(OleGetClipboard(out before)); Inspect(before,"before size="+size,format);Marshal.ReleaseComObject(before);
                  Console.WriteLine("flush="+OleFlushClipboard().ToString("X8"));
                  IDataObject after; Marshal.ThrowExceptionForHR(OleGetClipboard(out after));Inspect(after,"after size="+size,format);Marshal.ReleaseComObject(after);
                  if(Marshal.IsComObject(obj)) Marshal.ReleaseComObject(obj);
                }
                OleUninitialize();
              });
              thread.SetApartmentState(ApartmentState.STA);thread.Start();thread.Join();
            }
          }
          '@
          [Probe]::Run()
