name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  GOO_LINUX_APT_PACKAGES: >-
    binutils clang cmake curl ninja-build pkg-config zlib1g-dev
    fonts-dejavu-core fonts-noto-color-emoji
    libdbus-1-dev libdecor-0-dev libgl1-mesa-dev libgl1-mesa-dri
    libegl1 libfontconfig1 libibus-1.0-dev libwayland-dev
    libxkbcommon-dev mesa-vulkan-drivers vulkan-tools
    wayland-protocols weston

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.paths.outputs.full }}
      tools: ${{ steps.paths.outputs.tools }}
      lint: ${{ steps.paths.outputs.lint }}
      api: ${{ steps.paths.outputs.api }}
    steps:
      - id: paths
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            let full = context.eventName !== 'pull_request';
            let plugin = false;
            let api = false;
            if (!full) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100
              });
              full = files.length !== context.payload.pull_request.changed_files;
              for (const file of files) {
                for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                  if (path.startsWith('plugins/goo/')) plugin = true;
                  else if (path.startsWith('docs/') && path.endsWith('.md') && path !== 'docs/nuget-readme.md') {
                    if (path.startsWith('docs/api/')) api = true;
                  } else if (!path.startsWith('integrations/vscode/')) full = true;
                }
              }
            }
            core.setOutput('full', full);
            core.setOutput('tools', full || plugin || api);
            core.setOutput('lint', full || plugin);
            core.setOutput('api', full || api);

  quality:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.tools == 'true'
        with:
          global-json-file: global.json

      - name: Restore pinned G# authoring tools
        if: needs.changes.outputs.tools == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        if: needs.changes.outputs.tools == 'true'
        run: ./bootstrap.sh --gsharp-only

      - name: Build repo-local G# linter
        if: needs.changes.outputs.lint == 'true'
        run: |
          dotnet build tools/Goo.Gslint/Goo.Gslint.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet format tools/Goo.Gslint/Goo.Gslint.csproj \
            --verify-no-changes --no-restore
          python3 tools/Goo.Gslint/test.py

      - name: Enforce strict G# lint
        if: needs.changes.outputs.lint == 'true'
        run: |
          dotnet tools/Goo.Gslint/bin/Release/net10.0/Goo.Gslint.dll \
            --strict \
            --severity GL0005=none \
            --severity GL0006=none \
            --severity GL0001=none Goo Goo.Images Goo.Gestures Goo.NativeDialogs tests
          dotnet tools/Goo.Gslint/bin/Release/net10.0/Goo.Gslint.dll \
            --strict --severity GL0005=none --severity GL0006=none \
            apps templates plugins/goo/reference/templates

      - name: Build Goo and image assets with warnings as errors
        if: needs.changes.outputs.api == 'true'
        run: dotnet build Goo.Images/Goo.Images.gsproj -c Release -p:TreatWarningsAsErrors=true

      - name: Verify shared gesture recognizers
        run: dotnet test tests/Goo.Gestures.Tests/Goo.Gestures.Tests.csproj -c Release -p:TreatWarningsAsErrors=true
      - name: Build optional native dialogs
        run: dotnet build Goo.NativeDialogs/Goo.NativeDialogs.gsproj -c Release -f net10.0 -p:TreatWarningsAsErrors=true

      - name: Build optional native menus
        if: needs.changes.outputs.api == 'true'
        run: dotnet build Goo.NativeMenus/Goo.NativeMenus.gsproj -c Release -p:TreatWarningsAsErrors=true

      - name: Regenerate API documentation
        if: needs.changes.outputs.api == 'true'
        run: |
          dotnet run --project tools/Goo.ApiDocs/Goo.ApiDocs.csproj -c Release
          dotnet run --project tools/Goo.ApiDocs/Goo.ApiDocs.csproj -c Release -- \
            --source Goo.NativeMenus --xml Goo.NativeMenus/bin/Release/net10.0/Goo.NativeMenus.xml \
            --output docs/api-native-menus
          dotnet run --project tools/Goo.ApiDocs/Goo.ApiDocs.csproj -c Release -- \
            --source Goo.Images --xml Goo.Images/bin/Release/net10.0/Goo.Images.xml \
            --output docs/api-images

      - name: Validate onboarding and release metadata
        run: |
          python3 plugins/goo/scripts/sync_docs.py .
          .github/scripts/validate-onboarding.py

      - name: Run focused API contract tests
        if: needs.changes.outputs.api == 'true'
        run: |
          dotnet test tests/Goo.ApiContractTests/Goo.ApiContractTests.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Verify optional spell checking
        run: |
          sudo apt-get update
          sudo apt-get install -y libhunspell-1.7-0
          GOO_REQUIRE_HUNSPELL=1 dotnet test tests/Goo.SpellCheckTests/Goo.SpellCheckTests.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet format Goo.SpellCheck/Goo.SpellCheck.csproj --verify-no-changes --no-restore
          dotnet format Goo.SpellCheck.Hunspell/Goo.SpellCheck.Hunspell.csproj --verify-no-changes --no-restore
          dotnet format Goo.Printing/Goo.Printing.csproj --verify-no-changes --no-restore
      - name: Build Goo DevTools CLI
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Run Goo DevTools CLI tests
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet test tests/Goo.DevTools.Cli.Tests/Goo.DevTools.Cli.Tests.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Validate Goo DevTools integrations
        run: |
          node --check integrations/vscode/extension.js
          python3 - <<'PY'
          import xml.etree.ElementTree as element_tree
          element_tree.parse("integrations/rider/GooDevTools.xml")
          PY

  macos-native:
    needs: changes
    runs-on: ${{ needs.changes.outputs.full == 'true' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'

      - name: Install native build tools
        if: needs.changes.outputs.full == 'true'
        run: brew install cmake meson ninja

      - name: Build pinned macOS arm64 native payloads
        if: needs.changes.outputs.full == 'true'
        run: |
          native="$PWD/artifacts/macos-native"
          mkdir -p "$native"
          .github/scripts/build-sdl-macos-arm64.sh "$native/libSDL3.dylib"
          .github/scripts/fetch-moltenvk-macos-arm64.sh "$native/libMoltenVK.dylib"
          .github/scripts/build-text-native-macos-arm64.sh "$native"

      - name: Upload macOS native payloads
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goo-macos-arm64-native
          if-no-files-found: error
          path: artifacts/macos-native/

  macos-arm64:
    needs: [changes, macos-native]
    runs-on: ${{ needs.changes.outputs.full == 'true' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'

      - name: Load release version
        if: needs.changes.outputs.full == 'true'
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.full == 'true'
        with:
          global-json-file: global.json

      - name: Restore pinned G# authoring tools
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        if: needs.changes.outputs.full == 'true'
        run: ./bootstrap.sh --gsharp-only

      - name: Download macOS native payloads
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: goo-macos-arm64-native
          path: artifacts/macos-candidate/native

      - name: Verify Metal external image lifecycle
        run: |
          dotnet build tests/Goo.VulkanProof/Goo.VulkanProof.gsproj -c Release --nologo -warnaserror \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native"
          proof="$PWD/tests/Goo.VulkanProof/bin/Release/net10.0"
          clang -fobjc-arc -O2 -Wall -Wextra -Werror -dynamiclib \
            tests/Goo.VulkanProof/VulkanExternalMetalProducer.m \
            -framework Foundation -framework Metal -framework CoreVideo -framework IOSurface \
            -o "$proof/libgoo-external-metal-proof.dylib"
          .github/scripts/with-headless-wayland.sh env \
            XDG_CACHE_HOME="$RUNNER_TEMP/goo-metal-cache" \
            DYLD_LIBRARY_PATH="$proof:$PWD/artifacts/macos-candidate/native" \
            GOO_VK_EXTERNAL_METAL=1 MTL_DEBUG_LAYER=1 \
            dotnet "$proof/Goo.VulkanProof.dll"

      - name: Publish NativeAOT macOS smoke app
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p artifacts/packages
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true \
            -p:GooUseProjectReference=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/publish-macos-smoke

      - name: Verify NativeAOT local PNG loading on macOS
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet publish tests/Goo.ImageLoadingSmoke/Goo.ImageLoadingSmoke.gsproj \
            -c Release -r osx-arm64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/image-nativeaot
          artifacts/image-nativeaot/Goo.ImageLoadingSmoke

      - name: Verify NativeAOT native menus on macOS
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet publish tests/Goo.NativeMenuSmoke/Goo.NativeMenuSmoke.csproj \
            -c Release -r osx-arm64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/native-menu-smoke
          DYLD_LIBRARY_PATH="$PWD/artifacts/macos-candidate/native" artifacts/native-menu-smoke/Goo.NativeMenuSmoke

      - name: Stage, sign, and run macOS smoke bundle
        if: needs.changes.outputs.full == 'true'
        run: |
          .github/scripts/stage-macos-arm64.sh \
            artifacts/publish-macos-smoke \
            artifacts/macos-candidate/Goo.PackageSmoke.app \
            artifacts/macos-candidate/symbols \
            Goo.PackageSmoke \
            tests/Goo.PackageSmoke/Info.plist
          .github/scripts/with-headless-wayland.sh env MTL_DEBUG_LAYER=1 \
            XDG_CACHE_HOME="$RUNNER_TEMP/goo-metal-cache" GOO_PRIMITIVE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke
          GOO_NATIVE_BACKDROP_SMOKE=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke
          GOO_NATIVE_DIALOGS_SMOKE=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke
          GOO_NATIVE_POPUP_SMOKE=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke
          GOO_NATIVE_POPUP_MENU_SMOKE=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke

      - name: Verify cold and warm macOS application activation
        run: |
          python3 .github/scripts/test-macos-activation.py \
            artifacts/macos-candidate/Goo.PackageSmoke.app \
            artifacts/macos-activation-results

      - name: Package and run consumer DMG app
        if: needs.changes.outputs.full == 'true'
        env:
          GooPackageId: org.goo.packagesmoke
          Product: Goo Package Smoke
          GooUseProjectReference: true
        run: |
          export Version="$GOO_VERSION"
          export GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native"
          export GooPackageIcon="/System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns"
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj -c Release -m:4
          dotnet tools/Goo.DevTools.Cli/bin/Release/net10.0/Goo.DevTools.Cli.dll \
            package --target macos --project tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            --output "$PWD/artifacts/macos consumer"
          dmg="$PWD/artifacts/macos consumer/org.goo.packagesmoke-$GOO_VERSION-osx-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/consumer-mount"
          hdiutil attach "$dmg" -mountpoint "$RUNNER_TEMP/consumer-mount" -nobrowse
          ditto "$RUNNER_TEMP/consumer-mount/Goo.PackageSmoke.app" "$RUNNER_TEMP/Consumer Copy.app"
          hdiutil detach "$RUNNER_TEMP/consumer-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/Consumer Copy.app"
          GOO_PRIMITIVE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            "$RUNNER_TEMP/Consumer Copy.app/Contents/MacOS/Goo.PackageSmoke"

      - name: Verify NativeAOT UI audio on macOS
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet publish tests/Goo.AudioSmoke/Goo.AudioSmoke.gsproj \
            -c Release -r osx-arm64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/audio-nativeaot
          SDL_AUDIO_DRIVER=dummy artifacts/audio-nativeaot/Goo.AudioSmoke
          SDL_AUDIO_DRIVER=goo-unavailable GOO_AUDIO_UNAVAILABLE_SMOKE=1 \
            artifacts/audio-nativeaot/Goo.AudioSmoke

      - name: Fetch pinned Slang compiler
        if: needs.changes.outputs.full == 'true'
        run: |
          archive="$RUNNER_TEMP/slang-2026.16-macos-aarch64.tar.gz"
          sdk="$RUNNER_TEMP/slang-2026.16"
          curl --fail --location --retry 5 --retry-delay 2 \
            --retry-max-time 120 --retry-all-errors \
            --output "$archive" \
            https://github.com/shader-slang/slang/releases/download/v2026.16/slang-2026.16-macos-aarch64.tar.gz
          echo "5d7edc2c91c38d1914c14a5a410f0fe517bce9a284395336715ba36a091e9d9e  $archive" \
            | shasum -a 256 -c -
          mkdir -p "$sdk"
          tar -xzf "$archive" -C "$sdk"
          "$sdk/bin/slangc" -version 2>&1 | grep -Fx "2026.16"
          echo "SLANG_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Restore pinned SPIR-V validator
        if: needs.changes.outputs.full == 'true'
        id: spirv-val
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vulkan-sdk-1.4.357.0
          key: spirv-val-macos-arm64-1.4.357.0-9a49b0883b9b635689a85b5647dbfcb223268151

      - name: Build pinned SPIR-V validator
        if: needs.changes.outputs.full == 'true' && (steps.spirv-val.outputs.cache-hit != 'true')
        run: |
          brew install cmake ninja
          source="$RUNNER_TEMP/SPIRV-Tools-1.4.357.0"
          headers="$source/external/spirv-headers"
          build="$RUNNER_TEMP/SPIRV-Tools-1.4.357.0-build"
          sdk="$RUNNER_TEMP/vulkan-sdk-1.4.357.0"
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 \
            https://github.com/KhronosGroup/SPIRV-Tools.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = \
            "9a49b0883b9b635689a85b5647dbfcb223268151"
          git init "$headers"
          git -C "$headers" remote add origin \
            https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C "$headers" fetch --depth 1 origin \
            29981f65241605e08b0ede4cfeb999fe3b723c6a
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = \
            "29981f65241605e08b0ede4cfeb999fe3b723c6a"
          cmake -S "$source" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          cmake --build "$build" --target spirv-val --parallel 2
          mkdir -p "$sdk/bin"
          install -m0755 "$build/tools/spirv-val" "$sdk/bin/spirv-val"

      - name: Select pinned SPIR-V validator
        if: needs.changes.outputs.full == 'true'
        run: |
          sdk="$RUNNER_TEMP/vulkan-sdk-1.4.357.0"
          "$sdk/bin/spirv-val" --version 2>&1 \
            | grep -F "SPIRV-Tools v2026.3 vulkan-sdk-1.4.357.0"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Bundle Goo Gallery for testers
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet publish apps/Goo.Gallery/Goo.Gallery.gsproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/publish-macos-gallery
          .github/scripts/stage-macos-arm64.sh \
            artifacts/publish-macos-gallery \
            "artifacts/macos-candidate/Goo Gallery.app" \
            artifacts/macos-candidate/symbols \
            Goo.Gallery \
            apps/Goo.Gallery/Info.plist
          (
            cd artifacts/macos-candidate
            COPYFILE_DISABLE=1 tar -czf Goo.Gallery-macos-arm64.tar.gz \
              "Goo Gallery.app"
            shasum -a 256 Goo.Gallery-macos-arm64.tar.gz \
              >Goo.Gallery-macos-arm64.tar.gz.sha256
          )
          install -m0755 apps/Goo.Gallery/install-macos.sh \
            artifacts/macos-candidate/install-goo-gallery-macos.sh

      - name: Upload macOS release candidate
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goo-macos-arm64-candidate
          if-no-files-found: error
          path: |
            artifacts/macos-candidate/

  linux-validation:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'

      - name: Load release version
        if: needs.changes.outputs.full == 'true'
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.full == 'true'
        with:
          global-json-file: global.json

      - name: Restore pinned G# authoring tools
        if: needs.changes.outputs.full == 'true' && (github.ref_type != 'tag')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        if: needs.changes.outputs.full == 'true'
        run: ./bootstrap.sh --gsharp-only

      - &linux-apt-update
        if: needs.changes.outputs.full == 'true'
        name: Update Linux package lists
        id: linux-apt
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/goo-apt-archives"
          sudo apt-get --print-uris --yes --no-install-recommends install $GOO_LINUX_APT_PACKAGES \
            > "$RUNNER_TEMP/goo-apt-packages"
          read -r key _ < <(sha256sum "$RUNNER_TEMP/goo-apt-packages")
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - &linux-apt-cache
        if: needs.changes.outputs.full == 'true'
        name: Restore Linux package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/goo-apt-archives/*.deb
          key: apt-linux-x64-${{ steps.linux-apt.outputs.key }}

      - &linux-dependencies
        if: needs.changes.outputs.full == 'true'
        name: Install Linux build and Wayland dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$RUNNER_TEMP/goo-apt-archives" \
            $GOO_LINUX_APT_PACKAGES

      - &linux-vulkan-driver
        if: needs.changes.outputs.full == 'true'
        name: Pin Vulkan CPU driver
        run: |
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          test -f "${icds[0]}"
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"

      - name: Install pinned Vulkan validation layer
        if: needs.changes.outputs.full == 'true'
        run: |
          root="$RUNNER_TEMP/goo-vulkan-validation-layer"
          .github/scripts/install-vulkan-validation-layer-linux-x64.sh "$root"
          echo "VK_LAYER_PATH=$root/vulkan-validationlayers-1.4.313.0/usr/share/vulkan/explicit_layer.d" \
            >> "$GITHUB_ENV"

      - name: Restore pinned shader toolchain
        id: shader-toolchain
        if: needs.changes.outputs.full == 'true' && (github.ref_type != 'tag')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/goo-shader-toolchain/slang-2026.16
            ${{ runner.temp }}/goo-shader-toolchain/vulkan-sdk-1.4.357.0
          key: shader-toolchain-linux-x64-${{ hashFiles('.github/scripts/install-shader-toolchain-linux-x64.sh') }}

      - name: Install pinned shader toolchain
        if: needs.changes.outputs.full == 'true' && (steps.shader-toolchain.outputs.cache-hit != 'true')
        run: .github/scripts/install-shader-toolchain-linux-x64.sh "$RUNNER_TEMP/goo-shader-toolchain"

      - &linux-shader-toolchain
        if: needs.changes.outputs.full == 'true'
        name: Select pinned shader toolchain
        run: |
          root="$RUNNER_TEMP/goo-shader-toolchain"
          test "$("$root/slang-2026.16/bin/slangc" -version 2>&1)" = "2026.16"
          "$root/vulkan-sdk-1.4.357.0/bin/spirv-val" --version 2>&1 \
            | grep -F "SPIRV-Tools v2026.3 vulkan-sdk-1.4.357.0"
          echo "SLANG_SDK=$root/slang-2026.16" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$root/vulkan-sdk-1.4.357.0" >> "$GITHUB_ENV"

      - name: Restore glibc 2.27 native payloads
        id: glibc-native
        if: needs.changes.outputs.full == 'true' && (github.ref_type != 'tag')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            artifacts/native/libSDL3.so
            artifacts/native/libSDL3.a
            artifacts/native/text
          key: glibc227-native-dca176c9-${{ hashFiles('.github/scripts/build-sdl-linux-x64.sh', '.github/scripts/build-text-native-linux-x64.sh', '.github/patches/sdl/**', 'tests/NativeWindow/**', 'tools/Goo.TextNative/**') }}

      - name: Build glibc 2.27 native payloads
        if: needs.changes.outputs.full == 'true' && (steps.glibc-native.outputs.cache-hit != 'true')
        run: |
          mkdir -p artifacts/native/text
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/artifacts/native:/out" \
            ubuntu:18.04@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                binutils ca-certificates curl file g++-8 gcc-8 libdbus-1-dev \
                libasound2-dev libpulse-dev \
                libegl1-mesa-dev libexpat1-dev libffi-dev libfontconfig1-dev \
                libibus-1.0-dev libwayland-dev libxkbcommon-dev libxml2-dev \
                ninja-build patch pkg-config python3 python3-pip tar \
                wayland-protocols xz-utils zlib1g-dev
              update-ca-certificates
              pip3 install --no-cache-dir meson==0.61.5
              export CC=gcc-8 CXX=g++-8
              /src/.github/scripts/build-sdl-linux-x64.sh /out/libSDL3.so /out/libSDL3.a
              /src/.github/scripts/build-text-native-linux-x64.sh /out/text --static
            '

      - name: Compare rebuilt text payloads with the committed files
        if: needs.changes.outputs.full == 'true'
        run: |
          cmp artifacts/native/text/libgoo-harfbuzz.so \
            Goo/Runtime/Vulkan/linux-x64/libgoo-harfbuzz.so
          cmp artifacts/native/text/libgoo-harfbuzz-gpu.so \
            Goo/Runtime/Vulkan/linux-x64/libgoo-harfbuzz-gpu.so
          python3 .github/scripts/validate-text-native-rebuild.py \
            Goo/Runtime/Vulkan/linux-x64/text-native-build.json \
            artifacts/native/text/text-native-build.json

      - name: Verify Vulkan software driver and validation layer
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p artifacts/reports
          VK_LOADER_DEBUG=layer VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            vulkaninfo --summary 2>&1 | tee artifacts/reports/vulkaninfo-summary.txt
          grep -E '^VK_LAYER_KHRONOS_validation +Khronos Validation Layer +1\.4\.313 +version 1$' \
            artifacts/reports/vulkaninfo-summary.txt
          grep -F "$RUNNER_TEMP/goo-vulkan-validation-layer/vulkan-validationlayers-1.4.313.0/usr/lib/x86_64-linux-gnu/libVkLayer_khronos_validation.so" \
            artifacts/reports/vulkaninfo-summary.txt
          grep -E 'deviceType *= PHYSICAL_DEVICE_TYPE_CPU$' artifacts/reports/vulkaninfo-summary.txt

      - name: Fetch pinned Windows SDL runtime
        if: needs.changes.outputs.full == 'true'
        run: .github/scripts/fetch-sdl-win-x64.sh artifacts/native/win-x64/SDL3.dll

      - name: Build library
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build Goo/Goo.gsproj -c Release -p:TreatWarningsAsErrors=true

      - name: Verify presentation-independent offscreen pages
        run: |
          dotnet publish tests/Goo.OffscreenSmoke/Goo.OffscreenSmoke.csproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -o artifacts/offscreen-nativeaot
          .github/scripts/with-headless-wayland.sh env \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            GOO_VK_DIAGNOSTICS=1 artifacts/offscreen-nativeaot/Goo.OffscreenSmoke
      - name: Verify independent pages and raster PDF
        run: |
          dotnet publish tests/Goo.PrintingSmoke/Goo.PrintingSmoke.csproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -o artifacts/printing-nativeaot
          .github/scripts/with-headless-wayland.sh env \
            SDL_VIDEODRIVER=wayland LIBGL_ALWAYS_SOFTWARE=1 \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            artifacts/printing-nativeaot/Goo.PrintingSmoke artifacts/reports/printing.pdf

      - name: Verify shared UI audio without a hardware device
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet publish tests/Goo.AudioSmoke/Goo.AudioSmoke.gsproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -o artifacts/audio-nativeaot
          SDL_AUDIO_DRIVER=dummy artifacts/audio-nativeaot/Goo.AudioSmoke
          SDL_AUDIO_DRIVER=goo-unavailable GOO_AUDIO_UNAVAILABLE_SMOKE=1 \
            artifacts/audio-nativeaot/Goo.AudioSmoke

      - name: Build Goo DevTools app
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build apps/Goo.DevTools/Goo.DevTools.gsproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Verify real Gallery profiler UI
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build apps/Goo.Gallery/Goo.Gallery.gsproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          .github/scripts/with-headless-wayland.sh env \
            SDL_VIDEODRIVER=wayland LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            node .github/scripts/devtools-profiler-ui-smoke.mjs artifacts/reports/profiler-ui

      - name: Verify compiled shader effects
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build tools/Goo.ShaderEffectTool/Goo.ShaderEffectTool.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet exec tools/Goo.ShaderEffectTool/bin/Release/net10.0/Goo.ShaderEffectTool.dll compile \
            Goo/Shaders/Effects/backdrop_blur.slang Goo/Shaders/Authoring \
            "$RUNNER_TEMP/backdrop_blur.goo-effect" "$RUNNER_TEMP/backdrop_blur.goo-effect.json"
          cmp "$RUNNER_TEMP/backdrop_blur.goo-effect" Goo/Shaders/Effects/backdrop_blur.goo-effect
          dotnet exec tools/Goo.ShaderEffectTool/bin/Release/net10.0/Goo.ShaderEffectTool.dll compile \
            Goo/Shaders/Effects/filtered_backdrop.slang Goo/Shaders/Authoring \
            "$RUNNER_TEMP/filtered_backdrop.goo-effect" "$RUNNER_TEMP/filtered_backdrop.goo-effect.json"
          cmp "$RUNNER_TEMP/filtered_backdrop.goo-effect" Goo/Shaders/Effects/filtered_backdrop.goo-effect

      - name: Print profiler UI failure logs
        if: needs.changes.outputs.full == 'true' && (failure())
        run: |
          for log in artifacts/reports/profiler-ui/*.log; do
            test -f "$log" || continue
            printf '\n--- %s ---\n' "$log"
            cat "$log"
          done

      - name: Upload profiler UI evidence
        if: needs.changes.outputs.full == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goo-profiler-ui-linux-x64
          if-no-files-found: ignore
          path: artifacts/reports/profiler-ui/

      - name: Record dependencies and reject known vulnerabilities
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p artifacts/reports
          dotnet --info >artifacts/reports/dotnet-info.txt
          dotnet list Goo/Goo.gsproj package --include-transitive --format json \
            >artifacts/reports/dependencies.json
          dotnet list Goo/Goo.gsproj package --vulnerable --include-transitive --format json \
            >artifacts/reports/vulnerabilities.json
          if grep -q '"severity"' artifacts/reports/vulnerabilities.json; then
            cat artifacts/reports/vulnerabilities.json
            exit 1
          fi

      - name: Archive Linux build state
        if: needs.changes.outputs.full == 'true'
        run: |
          tar -czf "$RUNNER_TEMP/goo-linux-build.tar.gz" \
            --exclude=./.git --exclude=./artifacts/image-nativeaot \
            --exclude=./artifacts/audio-nativeaot .
          tar -czf "$RUNNER_TEMP/goo-linux-toolchain.tar.gz" \
            -C "$RUNNER_TEMP" goo-shader-toolchain goo-vulkan-validation-layer

      - name: Upload Linux build state
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: goo-linux-build
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/goo-linux-build.tar.gz
            ${{ runner.temp }}/goo-linux-toolchain.tar.gz

  linux-packages:
    needs: [changes, linux-validation, macos-native, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.full == 'true'

      - &linux-build-download
        if: needs.changes.outputs.full == 'true'
        name: Download Linux build state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: goo-linux-build
          path: ${{ runner.temp }}/goo-linux-build

      - &linux-build-restore
        if: needs.changes.outputs.full == 'true'
        name: Restore Linux build state
        run: |
          tar -xzf "$RUNNER_TEMP/goo-linux-build/goo-linux-build.tar.gz"
          tar -xzf "$RUNNER_TEMP/goo-linux-build/goo-linux-toolchain.tar.gz" -C "$RUNNER_TEMP"
          echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$RUNNER_TEMP/goo-vulkan-validation-layer/vulkan-validationlayers-1.4.313.0/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - &linux-dotnet
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - *linux-apt-update
      - *linux-apt-cache
      - *linux-dependencies
      - *linux-vulkan-driver
      - *linux-shader-toolchain

      - &linux-macos-download
        if: needs.changes.outputs.full == 'true'
        name: Download macOS native payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: goo-macos-arm64-native
          path: artifacts/macos-candidate/native

      - name: Pack Goo
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p artifacts/packages
          dotnet pack Goo/Goo.gsproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -p:GooWindowsSdlPath="$PWD/artifacts/native/win-x64/SDL3.dll" \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native"
          dotnet pack Goo.NativeDialogs/Goo.NativeDialogs.gsproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"

      - name: Pack optional spelling and printing services
        if: needs.changes.outputs.full == 'true'
        run: |
          for project in Goo.SpellCheck Goo.SpellCheck.Hunspell Goo.Printing; do
            dotnet pack "$project/$project.csproj" -c Release -o artifacts/packages \
              -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          done

      - name: Build and check packed CLR interop samples
        if: needs.changes.outputs.full == 'true'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/goo-interop-packages
        run: |
          for project in samples/interop/CSharp/CSharp.csproj \
                         samples/interop/FSharp/FSharp.fsproj \
                         samples/interop/VisualBasic/VisualBasic.vbproj; do
            dotnet restore "$project" --configfile samples/interop/NuGet.Config
            dotnet build "$project" -c Release --no-restore -m:4
            dotnet run --project "$project" -c Release --no-build -- --check
          done

      - name: Pack shared gesture recognizers
        run: |
          dotnet pack Goo.Gestures/Goo.Gestures.gsproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"

      - name: Verify packed NativeAOT gesture consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/gesture-nuget
          XDG_CACHE_HOME: ${{ runner.temp }}/gesture-cache
        run: |
          dotnet publish tests/Goo.Gestures.Smoke/Goo.Gestures.Smoke.gsproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            --configfile tests/Goo.PackageSmoke/NuGet.config -o artifacts/gesture-nativeaot
          LIBGL_ALWAYS_SOFTWARE=1 .github/scripts/with-headless-wayland.sh \
            artifacts/gesture-nativeaot/Goo.Gestures.Smoke

      - name: Pack and validate native accessibility runtimes
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet pack Goo.Accessibility/Goo.Accessibility.csproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          python3 .github/scripts/validate-accessibility-package.py "artifacts/packages/Goo.Accessibility.$GOO_VERSION.nupkg"

      - name: Download portable native menu package
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-package
          path: artifacts/portable-native-menus

      - name: Stage portable native menu package
        if: needs.changes.outputs.full == 'true'
        run: cp artifacts/portable-native-menus/Goo.NativeMenus.*.nupkg artifacts/packages/
      - name: Pack image assets and verify the clean NativeAOT consumer
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet pack Goo.Images/Goo.Images.gsproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          consumer="$PWD/artifacts/image-assets-consumer"
          mkdir -p "$consumer"
          tar --exclude=bin --exclude=obj -C tests -cf - Goo.ImageLoadingSmoke Shared/Assets \
            | tar -C "$consumer" -xf -
          printf '<configuration><packageSources><clear/><add key="local" value="%s"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><packageSourceMapping><packageSource key="local"><package pattern="Goo"/><package pattern="Goo.Images"/></packageSource><packageSource key="nuget.org"><package pattern="*"/></packageSource></packageSourceMapping></configuration>' \
            "$PWD/artifacts/packages" > "$consumer/NuGet.Config"
          dotnet publish "$consumer/Goo.ImageLoadingSmoke/Goo.ImageLoadingSmoke.gsproj" \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooImageUsePackages=true -p:RestoreConfigFile="$consumer/NuGet.Config" \
            -p:RestorePackagesPath="$PWD/artifacts/image-assets-package-cache" \
            -o artifacts/image-assets-nativeaot
          artifacts/image-assets-nativeaot/Goo.ImageLoadingSmoke

      - name: Pack Goo DevTools and template
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet pack tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"
          dotnet pack apps/Goo.DevTools/Goo.DevTools.gsproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"
          dotnet pack templates/Goo.Templates/Goo.Templates.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Upload ready packages
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-packages
          if-no-files-found: error
          path: artifacts/packages/

  linux-x64:
    needs: [changes, linux-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.full == 'true'
      - *linux-build-download
      - *linux-build-restore
      - *linux-dotnet
      - *linux-apt-update
      - *linux-apt-cache
      - *linux-dependencies
      - *linux-vulkan-driver
      - *linux-shader-toolchain
      - *linux-macos-download

      - name: Download ready packages
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-packages
          path: artifacts/packages

      - name: Collect advisory consumer publish report
        if: needs.changes.outputs.full == 'true'
        run: |
          python3 tools/Goo.ConsumerPerformance/run.py \
            --output artifacts/consumer-performance \
            --rid linux-x64 \
            --package-version "$GOO_VERSION" \
            --package-source "$PWD/artifacts/packages" \
            --publish-only

      - name: Validate DevTools package manifests
        if: needs.changes.outputs.full == 'true'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ["GOO_VERSION"]
          expected = {
              f"Goo.DevTools.{version}.nupkg": ("Goo.DevTools", "DotnetTool"),
              f"Goo.DevTools.App.{version}.nupkg": ("Goo.DevTools.App", "DotnetTool"),
              f"Goo.Templates.{version}.nupkg": ("Goo.Templates", "Template"),
          }
          root = Path("artifacts/packages")
          for package, (package_id, package_type) in expected.items():
              with ZipFile(root / package) as archive:
                  nuspecs = [name for name in archive.namelist() if name.endswith(".nuspec")]
                  if len(nuspecs) != 1:
                      raise RuntimeError(f"{package}: expected one nuspec, found {nuspecs}")
                  text = archive.read(nuspecs[0]).decode("utf-8")
                  if f'<id>{package_id}</id>' not in text:
                      raise RuntimeError(f"{package}: package id is missing")
                  if f'<packageType name="{package_type}"' not in text:
                      raise RuntimeError(f"{package}: package type is missing")
          PY

      - name: Generate, build and publish Goo template
        if: needs.changes.outputs.full == 'true'
        run: |
          template_hive="$RUNNER_TEMP/goo-template-hive"
          template_output="$RUNNER_TEMP/goo-template"
          export NUGET_PACKAGES="$RUNNER_TEMP/goo-template-packages"
          mkdir -p "$template_hive" "$template_output" "$NUGET_PACKAGES"
          dotnet new install \
            "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg" \
            --force --debug:custom-hive "$template_hive"
          dotnet new goo --name Generated --output "$template_output" \
            --debug:custom-hive "$template_hive"
          dotnet restore "$template_output/Generated.gsproj" \
            --configfile tests/Goo.PackageSmoke/NuGet.config
          dotnet build "$template_output/Generated.gsproj" \
            -c Release --no-restore -p:TreatWarningsAsErrors=true
          for profile in Trimmed NativeAot; do
            dotnet publish "$template_output/Generated.gsproj" \
              -c Release -p:PublishProfile="$profile" \
              -p:TreatWarningsAsErrors=true \
              -o "$RUNNER_TEMP/goo-template-$profile" \
              --configfile tests/Goo.PackageSmoke/NuGet.config
          done

      - name: Install packed Goo developer tools
        if: needs.changes.outputs.full == 'true'
        run: |
          tool_path="$RUNNER_TEMP/goo-tools"
          mkdir -p "$tool_path"
          dotnet tool install Goo.DevTools \
            --tool-path "$tool_path" \
            --version "$GOO_VERSION" \
            --add-source "$PWD/artifacts/packages"
          dotnet tool install Goo.DevTools.App \
            --tool-path "$tool_path" \
            --version "$GOO_VERSION" \
            --add-source "$PWD/artifacts/packages"
          test "$("$tool_path/goo" --version)" = "$GOO_VERSION"
          test -x "$tool_path/goo-devtools"
          dotnet tool list --tool-path "$tool_path" \
            | grep -F "goo.devtools "
          dotnet tool list --tool-path "$tool_path" \
            | grep -F "goo.devtools.app "

      - name: Publish clean package consumer
        if: needs.changes.outputs.full == 'true'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/goo-nuget-packages
        run: |
          rm -rf "$NUGET_PACKAGES" artifacts/publish artifacts/linux-x64 artifacts/symbols
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r linux-x64 --self-contained false \
            -p:UseAppHost=false \
            --configfile tests/Goo.PackageSmoke/NuGet.config \
            -o artifacts/publish

      - name: Publish and run clean NativeAOT consumer
        if: needs.changes.outputs.full == 'true'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/goo-nativeaot-packages
        run: |
          set -o pipefail
          rm -rf "$NUGET_PACKAGES" artifacts/publish-nativeaot
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishAot=true \
            --configfile tests/Goo.PackageSmoke/NuGet.config \
            -o artifacts/publish-nativeaot
          mkdir -p artifacts/nativeaot-onefile
          install -m0755 artifacts/publish-nativeaot/Goo.PackageSmoke \
            artifacts/nativeaot-onefile/Goo.PackageSmoke
          if readelf -d artifacts/nativeaot-onefile/Goo.PackageSmoke \
            | grep -Eq 'libSDL3|libgoo-harfbuzz'; then
            echo 'NativeAOT consumer retains a Goo native shared dependency' >&2
            exit 1
          fi
          LIBGL_ALWAYS_SOFTWARE=1 .github/scripts/with-headless-wayland.sh \
            env -u LD_LIBRARY_PATH GOO_PRIMITIVE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            artifacts/nativeaot-onefile/Goo.PackageSmoke \
            2>&1 | tee artifacts/reports/vulkan-nativeaot-cpu-startup.txt
          grep -E '"kind":"device".*"deviceType":4,' artifacts/reports/vulkan-nativeaot-cpu-startup.txt
          LIBGL_ALWAYS_SOFTWARE=1 .github/scripts/with-headless-wayland.sh \
            env -u LD_LIBRARY_PATH GOO_NATIVE_BACKDROP_SMOKE=1 GOO_REQUIRE_BACKDROP=0 \
            artifacts/nativeaot-onefile/Goo.PackageSmoke
          LIBGL_ALWAYS_SOFTWARE=1 .github/scripts/with-headless-wayland.sh \
            env -u LD_LIBRARY_PATH GOO_NATIVE_DIALOGS_SMOKE=1 \
            artifacts/nativeaot-onefile/Goo.PackageSmoke

      - name: Package and run consumer AppImage
        if: needs.changes.outputs.full == 'true'
        env:
          GooPackageId: org.goo.packagesmoke
          Product: Goo Package Smoke
        run: |
          bash tools/Goo.DevTools.Cli/Packaging/fetch-appimage-tools.sh "$RUNNER_TEMP/appimage-tools"
          export GOO_APPIMAGETOOL="$RUNNER_TEMP/appimage-tools/appimagetool-x86_64.AppImage"
          export GOO_APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-tools/runtime-x86_64"
          export GooPackageIcon="$PWD/tests/Shared/Assets/local-rgba.png"
          export Version="$GOO_VERSION"
          dotnet tool install Goo.DevTools --version "$GOO_VERSION" \
            --tool-path "$RUNNER_TEMP/goo-package-tool" --configfile tests/Goo.PackageSmoke/NuGet.config
          "$RUNNER_TEMP/goo-package-tool/goo" \
            package --project tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            --target linux --output "$PWD/artifacts/appimage consumer"
          image="$PWD/artifacts/appimage consumer/org.goo.packagesmoke-$GOO_VERSION-linux-x64.AppImage"
          test -x "$image"
          LIBGL_ALWAYS_SOFTWARE=1 .github/scripts/with-headless-wayland.sh \
            env -u LD_LIBRARY_PATH GOO_PRIMITIVE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            "$image" --appimage-extract-and-run

      - name: Stage minimal Linux bundle and separate symbols
        if: needs.changes.outputs.full == 'true'
        run: |
          .github/scripts/stage-linux-x64.sh \
            artifacts/publish artifacts/linux-x64 artifacts/symbols

      - name: Validate package, native ABI, checksums, and bundle size
        if: needs.changes.outputs.full == 'true'
        run: |
          .github/scripts/validate-release.py \
            --package "artifacts/packages/Goo.$GOO_VERSION.nupkg" \
            --symbols "artifacts/packages/Goo.$GOO_VERSION.snupkg" \
            --bundle artifacts/linux-x64
          mkdir -p artifacts/reports
          size=$(find artifacts/linux-x64 -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          printf '%s\n' "$size" >artifacts/reports/linux-bundle-size.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf 'Linux x64 bundle size: %s bytes (advisory)\n' "$size" >>"$GITHUB_STEP_SUMMARY"
          fi
          dotnet artifacts/linux-x64/Goo.PackageSmoke.dll

      - name: Archive release candidates
        if: needs.changes.outputs.full == 'true'
        run: |
          tar -C artifacts -czf "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz" linux-x64
          (
            cd artifacts
            sha256sum "Goo.$GOO_VERSION-linux-x64.tar.gz" \
              >"Goo.$GOO_VERSION-linux-x64.tar.gz.sha256"
          )


      - name: Upload release validation artifacts
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goo-${{ env.GOO_VERSION }}-linux-x64
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Accessibility.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.SpellCheck*.nupkg
            artifacts/packages/Goo.Printing*.nupkg
            artifacts/packages/Goo.NativeDialogs.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Gestures.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.NativeMenus.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Images.${{ env.GOO_VERSION }}.nupkg
            artifacts/linux-x64/
            artifacts/reports/
            artifacts/consumer-performance/*.json
            artifacts/consumer-performance/raw/*.log
            artifacts/consumer-performance/reports/

      - name: Upload symbols separately
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goo-${{ env.GOO_VERSION }}-symbols
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.snupkg
            artifacts/packages/Goo.Images.${{ env.GOO_VERSION }}.snupkg
            artifacts/symbols/
            artifacts/consumer-performance/stage/*/symbols/

      - name: Upload release candidates
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidates
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.snupkg
            artifacts/packages/Goo.Accessibility.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.SpellCheck*.nupkg
            artifacts/packages/Goo.Printing*.nupkg
            artifacts/packages/Goo.NativeDialogs.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Gestures.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.NativeMenus.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Images.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Images.${{ env.GOO_VERSION }}.snupkg
            artifacts/packages/Goo.DevTools.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.DevTools.App.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Templates.${{ env.GOO_VERSION }}.nupkg
            artifacts/Goo.${{ env.GOO_VERSION }}-linux-x64.tar.gz
            artifacts/Goo.${{ env.GOO_VERSION }}-linux-x64.tar.gz.sha256

  linux-fixtures:
    name: linux-${{ matrix.lane }}
    needs: [changes, linux-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: abi
            project: tests/Goo.VulkanAbiSmoke/Goo.VulkanAbiSmoke.csproj
          - lane: proof
            project: tests/Goo.VulkanProof/Goo.VulkanProof.gsproj
          - lane: async-readback
            project: tests/Goo.AsyncReadbackSmoke/Goo.AsyncReadbackSmoke.gsproj
          - lane: core
            project: tests/Goo.CoreBehaviorTests/Goo.CoreBehaviorTests.csproj
          - lane: image
            project: tests/Goo.ImageLoadingTests/Goo.ImageLoadingTests.csproj
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.changes.outputs.full == 'true'
      - *linux-build-download
      - *linux-build-restore
      - *linux-dotnet
      - *linux-apt-update
      - *linux-apt-cache
      - *linux-dependencies
      - *linux-vulkan-driver
      - *linux-shader-toolchain

      - name: Build fixture
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build "${{ matrix.project }}" -c Release -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"

      - name: Run ABI checks
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'abi')
        run: |
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          dotnet tests/Goo.VulkanAbiSmoke/bin/Release/net10.0/Goo.VulkanAbiSmoke.dll
          GOO_VK_DAMAGE_JOURNAL=1 \
            dotnet tests/Goo.VulkanAbiSmoke/bin/Release/net10.0/Goo.VulkanAbiSmoke.dll
          GOO_VK_SCENE_ALLOC=1 \
            dotnet tests/Goo.VulkanAbiSmoke/bin/Release/net10.0/Goo.VulkanAbiSmoke.dll

      - name: Run Vulkan proof checks
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'proof')
        run: |
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          run_vulkan_proof_lane() {
            .github/scripts/with-headless-wayland.sh env "$1=1" \
              dotnet tests/Goo.VulkanProof/bin/Release/net10.0/Goo.VulkanProof.dll
          }
          run_vulkan_proof_lane GOO_VK_TEXT_E2E
          run_vulkan_proof_lane GOO_VK_TEXT_PAINT_E2E
          run_vulkan_proof_lane GOO_VK_TEXT_EFFECT_READBACK
          run_vulkan_proof_lane GOO_VK_TEXT_PAINT_READBACK
          run_vulkan_proof_lane GOO_VK_IMAGE_READBACK

      - name: Run async readback checks
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'async-readback')
        run: |
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_LIQUID_GLASS_ALPHA_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_BACKDROP_BLUR_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_SHADER_EFFECT_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_SHADER_GENERATOR_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_FRAGMENT_CORRECTNESS_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_QUEUE_WAKE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_SVG_CORPUS_OUTPUT="$PWD/artifacts/reports/svg-corpus" \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VECTOR_RETAIN_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_SVG_MORPH_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_DIAGNOSTIC_CAPTURE_BUSY_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_PROFILER_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_PROFILER_SMOKE=1 GOO_PROFILE_START=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_EMBEDDED_HOST_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_WINDOW_ACTIVATION_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_NATIVE_POPUP_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_WINDOW_DISPLAY_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_TIMELINE_COMPLETION_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_PRIMITIVE_METRICS_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_PIPELINE_IDENTITY_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_CLIP_CAPTURE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_PARTIAL_REDRAW_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_EDITOR_GUTTER_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_SCROLLBAR_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_PORTAL_CAPTURE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_ROUNDED_RESIZE_FIRST_FRAME_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_HIDE_RESOURCES_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_IMAGE_STAGING_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_IMAGE_RELEASE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_TRANSPARENT_WINDOW_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_ORDERED_MODIFIER_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env GOO_VK_DIAGNOSTICS=1 \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

      - name: Verify local PNG pixels in Vulkan
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'async-readback')
        run: |
          set -o pipefail
          .github/scripts/with-headless-wayland.sh env \
            SDL_VIDEODRIVER=wayland LIBGL_ALWAYS_SOFTWARE=1 \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            GOO_IMAGE_FILE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll \
            2>&1 | tee artifacts/reports/vulkan-cpu-startup.txt
          grep -E '"kind":"device".*"deviceType":4,' artifacts/reports/vulkan-cpu-startup.txt

      - name: Run focused core behavior tests
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'core')
        run: |
          .github/scripts/with-headless-wayland.sh env \
            SDL_VIDEODRIVER=wayland \
            LIBGL_ALWAYS_SOFTWARE=1 \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            dotnet test tests/Goo.CoreBehaviorTests/Goo.CoreBehaviorTests.csproj \
              -c Release --no-build -p:TreatWarningsAsErrors=true \
              -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"

      - name: Run local PNG decoder and cache tests
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'image')
        run: |
          dotnet test tests/Goo.ImageLoadingTests/Goo.ImageLoadingTests.csproj \
            -c Release --no-build -p:TreatWarningsAsErrors=true

      - name: Verify NativeAOT local PNG loading
        if: needs.changes.outputs.full == 'true' && (matrix.lane == 'image')
        run: |
          dotnet publish tests/Goo.ImageLoadingSmoke/Goo.ImageLoadingSmoke.gsproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -o artifacts/image-nativeaot
          artifacts/image-nativeaot/Goo.ImageLoadingSmoke

      - name: Upload fixture reports
        if: needs.changes.outputs.full == 'true' && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: goo-linux-${{ matrix.lane }}-reports
          if-no-files-found: ignore
          path: artifacts/reports/

  windows-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rebuild Windows text native libraries
        run: |
          mkdir -p artifacts/windows-native
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/artifacts/windows-native:/out" \
            ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                binutils-mingw-w64-x86-64 ca-certificates curl file \
                gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 \
                meson ninja-build patch python3 tar xz-utils
              /src/.github/scripts/build-text-native-win-x64.sh /out
            '
      - name: Compare Windows text native libraries
        run: |
          cmp artifacts/windows-native/goo-harfbuzz.dll Goo/Runtime/Vulkan/win-x64/goo-harfbuzz.dll
          cmp artifacts/windows-native/goo-harfbuzz-gpu.dll Goo/Runtime/Vulkan/win-x64/goo-harfbuzz-gpu.dll
          python3 .github/scripts/validate-text-native-rebuild.py \
            Goo/Runtime/Vulkan/win-x64/text-native-build.json \
            artifacts/windows-native/text-native-build.json

  windows-x64:
    needs: [changes, linux-packages, windows-native]
    runs-on: ${{ needs.changes.outputs.full == 'true' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.full == 'true'
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.changes.outputs.full == 'true'
        with:
          name: linux-packages
          path: artifacts/packages
      - name: Build managed direct driver consumer
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          $version = python .github/scripts/release_version.py --print
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj -c Release -r win-x64 --self-contained true -p:ImportDirectoryBuildProps=false -p:GooReleaseVersion=$version --configfile tests/Goo.PackageSmoke/NuGet.config -o artifacts/direct-driver-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check elevated app-local direct Vulkan loading without an installed ICD
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw "Direct driver smoke must run elevated" }
          $mesa = Join-Path $env:RUNNER_TEMP "mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -OutFile $mesa
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash -ne "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695") { throw "Mesa SHA256 mismatch" }
          7z e $mesa x64/vulkan_lvp.dll -oartifacts/direct-driver-smoke -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Join-Path $env:RUNNER_TEMP "VulkanRT-X64-1.4.363.0-Components.zip"
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/VulkanRT-X64-1.4.363.0-Components.zip -OutFile $runtime
          if ((Get-FileHash $runtime -Algorithm SHA256).Hash -ne "a25a927aa8b9f0371048f1861cf88ac3b9bc9b1fb332c42d897c8ab32695769a") { throw "Vulkan runtime SHA256 mismatch" }
          Expand-Archive $runtime -DestinationPath "$env:RUNNER_TEMP/direct-vulkan-runtime"
          Copy-Item "$env:RUNNER_TEMP/direct-vulkan-runtime/VulkanRT-X64-1.4.363.0-Components/x64/vulkan-1.dll" artifacts/direct-driver-smoke
          $env:GOO_DIRECT_DRIVER_SMOKE = "1"
          $env:GOO_VK_DIAGNOSTICS = "1"
          & artifacts/direct-driver-smoke/Goo.PackageSmoke.exe 2>&1 | Tee-Object -Variable smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!($smoke -match '"kind":"device".*"name":"llvmpipe')) { throw "The direct llvmpipe device was not selected" }
          if (!($smoke -match 'direct-drivers: pixels matched')) { throw "Direct driver pixel check missing" }
          Remove-Item Env:GOO_DIRECT_DRIVER_SMOKE, Env:GOO_VK_DIAGNOSTICS
      - name: Install software Vulkan for native Windows checks
        if: needs.changes.outputs.full == 'true'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          install_lavapipe: true
          cache: true
          github_token: ${{ github.token }}
      - name: Enable cached Vulkan runtime
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:VULKAN_SDK "runtime\x64"
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $runtime "vulkaninfo.exe") --summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build NativeAOT consumer using the released G# SDK
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          $version = python .github/scripts/release_version.py --print
          dotnet restore tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj -r win-x64 -p:PublishAot=true -p:ImportDirectoryBuildProps=false -p:GooReleaseVersion=$version --configfile tests/Goo.PackageSmoke/NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishAot=true -p:ImportDirectoryBuildProps=false -p:GooReleaseVersion=$version -o artifacts/windows-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows rendering, resize, scrolling, multiple windows and allocations
        if: needs.changes.outputs.full == 'true'
        shell: pwsh
        run: |
          & artifacts/windows-smoke/run-windows-qualification.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOO_NATIVE_DIALOGS_SMOKE = "1"
          & artifacts/windows-smoke/Goo.PackageSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned consumer installer
        shell: pwsh
        run: |
          $version = python .github/scripts/release_version.py --print
          $installer = & tools/Goo.DevTools.Cli/Packaging/fetch-inno-setup.ps1 "$env:RUNNER_TEMP/goo-inno"
          $inno = Join-Path $env:RUNNER_TEMP 'goo-inno/compiler'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$inno" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          $env:GOO_ISCC = Join-Path $inno 'ISCC.exe'
          $env:GooPackageId = 'org.goo.packagesmoke'
          $env:Product = 'Goo Package Smoke'
          $env:Company = 'Goo'
          $env:Version = $version
          $env:GooReleaseVersion = $version
          $env:ImportDirectoryBuildProps = 'false'
          $env:GooPackageIcon = Join-Path $env:RUNNER_TEMP 'consumer.ico'
          Add-Type -AssemblyName System.Drawing
          $stream = [IO.File]::Create($env:GooPackageIcon)
          try { [Drawing.SystemIcons]::Application.Save($stream) } finally { $stream.Dispose() }
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj -c Release -m:4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tools/Goo.DevTools.Cli/bin/Release/net10.0/Goo.DevTools.Cli.dll package `
            --target windows --project tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj `
            --output "$PWD/artifacts/windows installer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "artifacts/windows installer/org.goo.packagesmoke-$version-win-x64-setup.exe"
          if (!(Test-Path $setup)) { throw 'Consumer installer missing' }
          if ((Get-AuthenticodeSignature $setup).Status -ne 'NotSigned') { throw 'Expected unsigned installer' }
      - name: Verify packaged NativeAOT Windows menus
        shell: pwsh
        run: |
          $version = python .github/scripts/release_version.py --print
          dotnet publish tests/Goo.NativeMenuSmoke/Goo.NativeMenuSmoke.csproj -c Release -r win-x64 `
            -p:PublishAot=true -p:TreatWarningsAsErrors=true -p:GooMenuUsePackages=true `
            -p:ImportDirectoryBuildProps=false -p:GooReleaseVersion=$version `
            --configfile tests/Goo.PackageSmoke/NuGet.config -o artifacts/native-menu-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & artifacts/native-menu-smoke/Goo.NativeMenuSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native Windows clipboard formats
        shell: pwsh
        run: |
          $version = python .github/scripts/release_version.py --print
          $env:GOO_CLIPBOARD_CHILD = (Resolve-Path artifacts/windows-smoke/Goo.PackageSmoke.exe).Path
          dotnet restore tests/Goo.ApiContractTests/Goo.ApiContractTests.csproj --configfile tests/Goo.PackageSmoke/NuGet.config -p:ImportDirectoryBuildProps=false -p:GooSmokeUsePackages=true -p:GooReleaseVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Goo.ApiContractTests/Goo.ApiContractTests.csproj -c Release --no-restore -p:ImportDirectoryBuildProps=false -p:GooSmokeUsePackages=true -p:GooReleaseVersion=$version --filter FullyQualifiedName~WindowsClipboardTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.changes.outputs.full == 'true' && (always())
        with:
          name: goo-windows-qualification
          path: artifacts/windows-smoke/results-*/

  release-goo:
    if: github.repository == 'obselate/goo' && startsWith(github.ref, 'refs/tags/v')
    needs: [changes, quality, macos-arm64, linux-validation, linux-fixtures, linux-packages, linux-x64, android, android-accessibility, android-consumer, android-native-menus, windows-x64]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Load release version
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GOO_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$GITHUB_REF_NAME" = "v$GOO_VERSION"
          python3 .github/scripts/release_version.py --check
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 .github/scripts/release_version.py --notes > "$RUNNER_TEMP/goo-release-notes.md"

      - name: Download release candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidates
          path: artifacts

      - name: Download macOS release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: goo-macos-arm64-candidate
          path: artifacts/macos-candidate

      - name: Download Android adapter package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-package
          path: artifacts/packages

      - name: Require NuGet trusted-publishing identity
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"

      - name: Get temporary NuGet API key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish Goo developer packages to NuGet.org
        run: |
          dotnet nuget push "artifacts/packages/Goo.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Android.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.NativeDialogs.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.$GOO_VERSION.snupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Accessibility.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Gestures.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.NativeMenus.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Images.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Images.$GOO_VERSION.snupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.DevTools.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.DevTools.App.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          for package in Goo.SpellCheck Goo.SpellCheck.Hunspell Goo.SpellCheck.Android Goo.Printing Goo.Printing.Android; do
            dotnet nuget push "artifacts/packages/$package.$GOO_VERSION.nupkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/goo-release-notes.md"
          release_flags=()
          if [[ "$GOO_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          assets=(
            "artifacts/packages/Goo.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.$GOO_VERSION.snupkg"
            "artifacts/packages/Goo.Android.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.NativeDialogs.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Accessibility.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Gestures.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.NativeMenus.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Images.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Images.$GOO_VERSION.snupkg"
            "artifacts/packages/Goo.SpellCheck.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.SpellCheck.Hunspell.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.SpellCheck.Android.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Printing.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Printing.Android.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.DevTools.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.DevTools.App.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg"
            "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz"
            "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz.sha256"
            "artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz"
            "artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz.sha256"
            "artifacts/macos-candidate/install-goo-gallery-macos.sh"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              "${release_flags[@]}" \
              --verify-tag \
              --title "Goo $GOO_VERSION" \
              --notes-file "$notes_file"
          fi

  android:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GooBuildAndroid: 'true'
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.full == 'true'
        with:
          global-json-file: global.json

      - name: Restore pinned G# authoring tools
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        if: needs.changes.outputs.full == 'true'
        run: ./bootstrap.sh --gsharp-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: needs.changes.outputs.full == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android and native toolchains
        if: needs.changes.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
          dotnet workload install android
      - name: Rebuild Android native payloads and compare with the committed files
        if: needs.changes.outputs.full == 'true'
        run: |
          for rid in android-arm64 android-x64; do
            bash .github/scripts/build-text-native-android.sh "$rid" "artifacts/android-rebuild/$rid" "$ANDROID_HOME/ndk/27.2.12479018"
            cmp "artifacts/android-rebuild/$rid/libgoo-harfbuzz.so" "Goo/Runtime/Vulkan/$rid/libgoo-harfbuzz.so"
            cmp "artifacts/android-rebuild/$rid/libgoo-harfbuzz-gpu.so" "Goo/Runtime/Vulkan/$rid/libgoo-harfbuzz-gpu.so"
          done
      - name: Build shared desktop scene and Android adapter
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet build tests/Goo.AndroidSmoke.Desktop/Goo.AndroidSmoke.Desktop.gsproj -c Release -p:TreatWarningsAsErrors=true
          dotnet build Goo.NativeMenus/Goo.NativeMenus.gsproj -c Release -p:GooBuildAndroid=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          dotnet build tests/Goo.AndroidSmoke/Goo.AndroidSmoke.csproj -c Release -p:GooBuildAndroid=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          dotnet build tests/Goo.OffscreenAndroidSmoke/Goo.OffscreenAndroidSmoke.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          dotnet build Goo.SpellCheck.Android/Goo.SpellCheck.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          dotnet build Goo.Printing.Android/Goo.Printing.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          dotnet build Goo.NativeDialogs/Goo.NativeDialogs.gsproj -c Release -f net10.0-android -p:GooBuildAndroid=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
      - name: Pack Android adapter
        if: needs.changes.outputs.full == 'true'
        run: |
          dotnet pack Goo.Android/Goo.Android.csproj -c Release --no-build -o artifacts/android-packages -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          dotnet pack Goo.SpellCheck.Android/Goo.SpellCheck.Android.csproj -c Release --no-build -o artifacts/android-packages -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          dotnet pack Goo.Printing.Android/Goo.Printing.Android.csproj -c Release --no-build -o artifacts/android-packages -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
          dotnet format Goo.SpellCheck.Android/Goo.SpellCheck.Android.csproj --verify-no-changes --no-restore
          dotnet format Goo.Printing.Android/Goo.Printing.Android.csproj --verify-no-changes --no-restore
          dotnet pack Goo.NativeDialogs/Goo.NativeDialogs.gsproj -c Release -o artifacts/android-packages -p:GooBuildAndroid=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
      - name: Pack Android native menus
        if: needs.changes.outputs.full == 'true'
        run: dotnet pack Goo.NativeMenus/Goo.NativeMenus.gsproj -c Release --no-build -p:GooBuildAndroid=true -o artifacts/android-packages -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.changes.outputs.full == 'true'
        with:
          name: android-package
          path: artifacts/android-packages/*.nupkg
      - name: Verify Release APK and AAB payloads
        if: needs.changes.outputs.full == 'true'
        run: |
          python3 .github/scripts/validate-android-package.py tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
          python3 .github/scripts/validate-android-package.py tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.changes.outputs.full == 'true'
        with:
          name: android-smoke
          path: |
            tests/Goo.AndroidSmoke/bin/Release/net10.0-android/*.apk
            tests/Goo.AndroidSmoke/bin/Release/net10.0-android/*.aab
            Goo/Runtime/Vulkan/android-*/text-native-build.json
      - name: Package signed consumer AAB
        run: |
          bash tools/Goo.DevTools.Cli/Packaging/fetch-bundletool.sh "$RUNNER_TEMP/android-tools"
          export GOO_BUNDLETOOL="$RUNNER_TEMP/android-tools/bundletool-all-1.18.3.jar"
          export AndroidKeyStore=true
          export AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          export AndroidSigningKeyAlias=upload
          printf '%s' 'goo-ci-upload-password' >"$RUNNER_TEMP/upload-password"
          chmod 0600 "$RUNNER_TEMP/upload-password"
          export AndroidSigningKeyPass="file:$RUNNER_TEMP/upload-password"
          export AndroidSigningStorePass="file:$RUNNER_TEMP/upload-password"
          keytool -genkeypair -keystore "$AndroidSigningKeyStore" -alias upload -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=Goo CI Upload" \
            -storepass:file "$RUNNER_TEMP/upload-password" -keypass:file "$RUNNER_TEMP/upload-password"
          export AndroidSdkDirectory="$ANDROID_HOME"
          export JavaSdkDirectory="$JAVA_HOME"
          export GooBuildAndroid=true
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj -c Release -m:4
          dotnet tools/Goo.DevTools.Cli/bin/Release/net10.0/Goo.DevTools.Cli.dll package \
            --target android --project tests/Goo.AndroidSmoke/Goo.AndroidSmoke.csproj \
            --output "$PWD/artifacts/signed-aab"
          bundle="$(find artifacts/signed-aab -name '*.[aA][aA][bB]' -print -quit)"
          test -n "$bundle"
          python3 .github/scripts/validate-android-package.py "$bundle"
          java -jar "$GOO_BUNDLETOOL" build-apks --bundle="$bundle" \
            --output="$RUNNER_TEMP/consumer.apks" --mode=universal \
            --ks="$AndroidSigningKeyStore" --ks-key-alias=upload \
            --ks-pass="file:$RUNNER_TEMP/upload-password" --key-pass="file:$RUNNER_TEMP/upload-password"
          unzip -p "$RUNNER_TEMP/consumer.apks" universal.apk >"$RUNNER_TEMP/consumer.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/consumer.apk"

  android-native-menus:
    needs: [changes, android]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-smoke
          path: artifacts/android-native-menu-app
      - name: Enable Android hardware virtualization
        run: sudo chmod 666 /dev/kvm
      - name: Check native Android context menus
        run: |
          .github/scripts/run-android-native-menus.sh \
            artifacts/android-native-menu-app/tests/Goo.AndroidSmoke/bin/Release/net10.0-android/*-Signed.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-native-menu-results
          path: artifacts/android-native-menus/logs/

  android-accessibility:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-smoke
          path: artifacts/android-smoke
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Check native accessibility through UiAutomation
        run: .github/scripts/run-android-accessibility.sh "$(find artifacts/android-smoke -name org.goo.androidsmoke-Signed.apk -print -quit)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-accessibility-36
          path: artifacts/android-accessibility-36/logs

  android-consumer:
    needs: [changes, linux-packages, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: No affected inputs
        if: needs.changes.outputs.full != 'true'
        run: echo "No affected inputs"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.full == 'true'
        with:
          global-json-file: global.json

      - name: Restore pinned G# authoring tools
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/gsharp
          key: gsharp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap.sh', 'global.json') }}

      - name: Build pinned upstream G# authoring tools
        if: needs.changes.outputs.full == 'true'
        run: ./bootstrap.sh --gsharp-only
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: needs.changes.outputs.full == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        if: needs.changes.outputs.full == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          dotnet workload install android
      - name: Download main package for Android consumer validation
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-packages
          path: artifacts/main-release/packages
      - name: Download Android adapter package
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-package
          path: artifacts/android-packages
      - name: Build clean Android package consumer
        if: needs.changes.outputs.full == 'true'
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/artifacts/android-consumer-cache
        run: |
          cp artifacts/main-release/packages/Goo.[0-9]*.nupkg artifacts/main-release/packages/Goo.Gestures.*.nupkg artifacts/main-release/packages/Goo.Templates.*.nupkg artifacts/android-packages/
          python3 - <<'PYCONFIG'
          import shutil
          from pathlib import Path
          source = Path('artifacts/android-packages').resolve()
          Path('artifacts/android-nuget.config').write_text(f'<configuration><packageSources><clear/><add key="local" value="{source}"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><packageSourceMapping><packageSource key="local"><package pattern="Goo"/><package pattern="Goo.Android"/><package pattern="Goo.Gestures"/><package pattern="Goo.NativeMenus"/><package pattern="Goo.NativeDialogs"/></packageSource><packageSource key="nuget.org"><package pattern="*"/></packageSource></packageSourceMapping></configuration>')
          consumer = Path('artifacts/android-consumer')
          for name in ['Goo.AndroidSmoke', 'Goo.AndroidSmoke.Shared']:
              shutil.copytree(Path('tests') / name, consumer / name, ignore=shutil.ignore_patterns('bin', 'obj'))
          font = Path('Goo.VulkanProof/Assets/Text/VendSans-VariableFont_wght.ttf')
          (consumer / font).parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(Path('tests') / font, consumer / font)
          PYCONFIG
          dotnet build artifacts/android-consumer/Goo.AndroidSmoke/Goo.AndroidSmoke.csproj -c Release -p:GooSmokeUsePackages=true -p:RestoreConfigFile="$PWD/artifacts/android-nuget.config" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          python3 .github/scripts/validate-android-package.py artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
          python3 .github/scripts/validate-android-package.py artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
      - name: Build Android starter from the packed template
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/artifacts/android-consumer-cache
        run: |
          dotnet new install artifacts/android-packages/Goo.Templates.*.nupkg
          dotnet new goo-android --name AndroidStarter --output artifacts/android-starter --application-id org.goo.androidstarter
          dotnet build artifacts/android-starter/AndroidStarter.csproj -c Release -p:RestoreConfigFile="$PWD/artifacts/android-nuget.config" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
