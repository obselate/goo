name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate onboarding and release metadata
        run: .github/scripts/validate-onboarding.py

      - name: Build repo-local G# linter
        run: |
          dotnet build tools/Goo.Gslint/Goo.Gslint.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet format tools/Goo.Gslint/Goo.Gslint.csproj \
            --verify-no-changes --no-restore

      - name: Enforce strict G# lint
        run: |
          dotnet tools/Goo.Gslint/bin/Release/net10.0/Goo.Gslint.dll \
            --strict \
            --severity GL0005=none \
            --severity GL0006=none \
            Goo apps templates tests plugins/goo/reference/templates

      - name: Build Goo with warnings as errors
        run: dotnet build Goo/Goo.gsproj -c Release -p:TreatWarningsAsErrors=true

      - name: Build optional runtime SVG library
        run: dotnet build Goo.Svg/Goo.Svg.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Regenerate API documentation
        run: |
          dotnet run --project tools/Goo.ApiDocs/Goo.ApiDocs.csproj -c Release
          git diff --exit-code -- docs/api

      - name: Run focused API contract tests
        run: |
          dotnet test tests/Goo.ApiContractTests/Goo.ApiContractTests.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Run focused runtime SVG tests
        run: |
          dotnet test tests/Goo.Svg.Tests/Goo.Svg.Tests.csproj \
            -c Release -p:TreatWarningsAsErrors=true

  macos-arm64:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Load release version
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install native build tools
        run: brew install cmake meson ninja

      - name: Build pinned macOS arm64 native payloads
        run: |
          native="$PWD/artifacts/macos-candidate/native"
          mkdir -p "$native"
          .github/scripts/build-sdl-macos-arm64.sh "$native/libSDL3.dylib"
          .github/scripts/fetch-moltenvk-macos-arm64.sh "$native/libMoltenVK.dylib"
          .github/scripts/build-text-native-macos-arm64.sh "$native"

      - name: Publish NativeAOT macOS smoke app
        run: |
          mkdir -p artifacts/packages
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true \
            -p:GooUseProjectReference=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/publish-macos-smoke

      - name: Stage, sign, and run macOS smoke bundle
        run: |
          .github/scripts/stage-macos-arm64.sh \
            artifacts/publish-macos-smoke \
            artifacts/macos-candidate/Goo.PackageSmoke.app \
            artifacts/macos-candidate/symbols \
            Goo.PackageSmoke \
            tests/Goo.PackageSmoke/Info.plist
          GOO_PRIMITIVE_SMOKE=1 GOO_VK_DIAGNOSTICS=1 \
            artifacts/macos-candidate/Goo.PackageSmoke.app/Contents/MacOS/Goo.PackageSmoke

      - name: Verify NativeAOT UI audio on macOS
        run: |
          dotnet publish tests/Goo.AudioSmoke/Goo.AudioSmoke.gsproj \
            -c Release -r osx-arm64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/audio-nativeaot
          SDL_AUDIO_DRIVER=dummy artifacts/audio-nativeaot/Goo.AudioSmoke
          SDL_AUDIO_DRIVER=goo-unavailable GOO_AUDIO_UNAVAILABLE_SMOKE=1 \
            artifacts/audio-nativeaot/Goo.AudioSmoke

      - name: Fetch pinned Slang compiler
        run: |
          archive="$RUNNER_TEMP/slang-2026.16-macos-aarch64.tar.gz"
          sdk="$RUNNER_TEMP/slang-2026.16"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/shader-slang/slang/releases/download/v2026.16/slang-2026.16-macos-aarch64.tar.gz
          echo "5d7edc2c91c38d1914c14a5a410f0fe517bce9a284395336715ba36a091e9d9e  $archive" \
            | shasum -a 256 -c -
          mkdir -p "$sdk"
          tar -xzf "$archive" -C "$sdk"
          "$sdk/bin/slangc" -version 2>&1 | grep -Fx "2026.16"
          echo "SLANG_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Build pinned SPIR-V validator
        run: |
          source="$RUNNER_TEMP/SPIRV-Tools-1.4.357.0"
          headers="$source/external/spirv-headers"
          build="$RUNNER_TEMP/SPIRV-Tools-1.4.357.0-build"
          sdk="$RUNNER_TEMP/vulkan-sdk-1.4.357.0"
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 \
            https://github.com/KhronosGroup/SPIRV-Tools.git "$source"
          test "$(git -C "$source" rev-parse HEAD)" = \
            "9a49b0883b9b635689a85b5647dbfcb223268151"
          git init "$headers"
          git -C "$headers" remote add origin \
            https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C "$headers" fetch --depth 1 origin \
            29981f65241605e08b0ede4cfeb999fe3b723c6a
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = \
            "29981f65241605e08b0ede4cfeb999fe3b723c6a"
          cmake -S "$source" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          cmake --build "$build" --target spirv-val --parallel 2
          mkdir -p "$sdk/bin"
          install -m0755 "$build/tools/spirv-val" "$sdk/bin/spirv-val"
          "$sdk/bin/spirv-val" --version 2>&1 \
            | grep -F "SPIRV-Tools v2026.3 vulkan-sdk-1.4.357.0"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Bundle Goo Gallery for testers
        run: |
          dotnet publish apps/Goo.Gallery/Goo.Gallery.gsproj \
            -c Release -r osx-arm64 --self-contained true \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native" \
            -o artifacts/publish-macos-gallery
          .github/scripts/stage-macos-arm64.sh \
            artifacts/publish-macos-gallery \
            "artifacts/macos-candidate/Goo Gallery.app" \
            artifacts/macos-candidate/symbols \
            Goo.Gallery \
            apps/Goo.Gallery/Info.plist
          (
            cd artifacts/macos-candidate
            COPYFILE_DISABLE=1 tar -czf Goo.Gallery-macos-arm64.tar.gz \
              "Goo Gallery.app"
            shasum -a 256 Goo.Gallery-macos-arm64.tar.gz \
              >Goo.Gallery-macos-arm64.tar.gz.sha256
          )
          install -m0755 apps/Goo.Gallery/install-macos.sh \
            artifacts/macos-candidate/install-goo-gallery-macos.sh

      - name: Upload macOS release candidate
        uses: actions/upload-artifact@v7
        with:
          name: goo-macos-arm64-candidate
          if-no-files-found: error
          path: |
            artifacts/macos-candidate/

  linux-x64:
    needs:
      - quality
      - macos-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Load release version
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - name: Download macOS release candidate
        uses: actions/download-artifact@v8
        with:
          name: goo-macos-arm64-candidate
          path: artifacts/macos-candidate

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Linux build and Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils clang cmake curl ninja-build pkg-config zlib1g-dev \
            fonts-dejavu-core fonts-noto-color-emoji \
            libdbus-1-dev libdecor-0-dev libgl1-mesa-dev libgl1-mesa-dri \
            libegl1 libfontconfig1 libibus-1.0-dev libwayland-dev \
            libxkbcommon-dev mesa-vulkan-drivers vulkan-tools \
            wayland-protocols weston

      - name: Install pinned Vulkan validation layer
        run: |
          root="$RUNNER_TEMP/goo-vulkan-validation-layer"
          .github/scripts/install-vulkan-validation-layer-linux-x64.sh "$root"
          echo "VK_LAYER_PATH=$root/vulkan-validationlayers-1.4.313.0/usr/share/vulkan/explicit_layer.d" \
            >> "$GITHUB_ENV"

      - name: Install pinned shader toolchain
        run: |
          .github/scripts/install-shader-toolchain-linux-x64.sh "$RUNNER_TEMP/goo-shader-toolchain"
          echo "SLANG_SDK=$RUNNER_TEMP/goo-shader-toolchain/slang-2026.16" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=$RUNNER_TEMP/goo-shader-toolchain/vulkan-sdk-1.4.357.0" >> "$GITHUB_ENV"

      - name: Build Goo DevTools CLI
        run: |
          dotnet build tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Run Goo DevTools CLI tests
        run: |
          dotnet test tests/Goo.DevTools.Cli.Tests/Goo.DevTools.Cli.Tests.csproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Validate Goo DevTools integrations
        run: |
          node --check integrations/vscode/extension.js
          python3 - <<'PY'
          import xml.etree.ElementTree as element_tree
          element_tree.parse("integrations/rider/GooDevTools.xml")
          PY

      - name: Build glibc 2.27 native payloads
        run: |
          mkdir -p artifacts/native/text
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/artifacts/native:/out" \
            ubuntu:18.04@sha256:dca176c9663a7ba4c1f0e710986f5a25e672842963d95b960191e2d9f7185ebe \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                binutils ca-certificates curl file g++-8 gcc-8 libdbus-1-dev \
                libasound2-dev libpulse-dev \
                libegl1-mesa-dev libexpat1-dev libffi-dev libfontconfig1-dev \
                libibus-1.0-dev libwayland-dev libxkbcommon-dev libxml2-dev \
                ninja-build patch pkg-config python3 python3-pip tar \
                wayland-protocols xz-utils zlib1g-dev
              update-ca-certificates
              pip3 install --no-cache-dir meson==0.61.5
              export CC=gcc-8 CXX=g++-8
              /src/.github/scripts/build-sdl-linux-x64.sh /out/libSDL3.so
              /src/.github/scripts/build-text-native-linux-x64.sh /out/text
              cmp /out/text/libgoo-harfbuzz.so \
                /src/Goo/Runtime/Vulkan/linux-x64/libgoo-harfbuzz.so
              cmp /out/text/libgoo-harfbuzz-gpu.so \
                /src/Goo/Runtime/Vulkan/linux-x64/libgoo-harfbuzz-gpu.so
              python3 /src/.github/scripts/validate-text-native-rebuild.py \
                /src/Goo/Runtime/Vulkan/linux-x64/text-native-build.json \
                /out/text/text-native-build.json
            '

      - name: Verify Vulkan software driver and validation layer
        run: |
          mkdir -p artifacts/reports
          VK_LOADER_DEBUG=layer VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            vulkaninfo --summary 2>&1 | tee artifacts/reports/vulkaninfo-summary.txt
          grep -E '^VK_LAYER_KHRONOS_validation +Khronos Validation Layer +1\.4\.313 +version 1$' \
            artifacts/reports/vulkaninfo-summary.txt
          grep -F "$RUNNER_TEMP/goo-vulkan-validation-layer/vulkan-validationlayers-1.4.313.0/usr/lib/x86_64-linux-gnu/libVkLayer_khronos_validation.so" \
            artifacts/reports/vulkaninfo-summary.txt

      - name: Fetch pinned Windows SDL runtime
        run: .github/scripts/fetch-sdl-win-x64.sh artifacts/native/win-x64/SDL3.dll

      - name: Build library and Vulkan verification projects
        run: |
          dotnet build Goo/Goo.gsproj -c Release -p:TreatWarningsAsErrors=true
          dotnet build tools/Goo.SvgCompiler/Goo.SvgCompiler.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet build Goo.Svg/Goo.Svg.csproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet build tests/Goo.VulkanAbiSmoke/Goo.VulkanAbiSmoke.csproj \
            -c Release -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"
          dotnet build tests/Goo.VulkanProof/Goo.VulkanProof.gsproj \
            -c Release -p:TreatWarningsAsErrors=true
          dotnet build tests/Goo.FailedIdleSmoke/Goo.FailedIdleSmoke.gsproj \
            -c Release -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"
          dotnet build tests/Goo.AsyncReadbackSmoke/Goo.AsyncReadbackSmoke.gsproj \
            -c Release -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"

      - name: Verify shared UI audio without a hardware device
        run: |
          dotnet publish tests/Goo.AudioSmoke/Goo.AudioSmoke.gsproj \
            -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -o artifacts/audio-nativeaot
          SDL_AUDIO_DRIVER=dummy artifacts/audio-nativeaot/Goo.AudioSmoke
          SDL_AUDIO_DRIVER=goo-unavailable GOO_AUDIO_UNAVAILABLE_SMOKE=1 \
            artifacts/audio-nativeaot/Goo.AudioSmoke

      - name: Build Goo DevTools app
        run: |
          dotnet build apps/Goo.DevTools/Goo.DevTools.gsproj \
            -c Release -p:TreatWarningsAsErrors=true

      - name: Run portable Vulkan checks
        run: |
          export SDL_VIDEODRIVER=wayland
          export LIBGL_ALWAYS_SOFTWARE=1
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          dotnet tests/Goo.VulkanAbiSmoke/bin/Release/net10.0/Goo.VulkanAbiSmoke.dll

          run_vulkan_proof_lane() {
            .github/scripts/with-headless-wayland.sh env "$1=1" \
              dotnet tests/Goo.VulkanProof/bin/Release/net10.0/Goo.VulkanProof.dll
          }
          run_vulkan_proof_lane GOO_VK_TEXT_E2E
          run_vulkan_proof_lane GOO_VK_TEXT_PAINT_E2E
          run_vulkan_proof_lane GOO_VK_TEXT_EFFECT_READBACK
          run_vulkan_proof_lane GOO_VK_TEXT_PAINT_READBACK
          run_vulkan_proof_lane GOO_VK_IMAGE_READBACK

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_LIQUID_GLASS_ALPHA_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_SHADER_EFFECT_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_FRAGMENT_CORRECTNESS_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_QUEUE_WAKE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_DIAGNOSTIC_CAPTURE_BUSY_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_EMBEDDED_HOST_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_TIMELINE_COMPLETION_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_PRIMITIVE_METRICS_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_PIPELINE_IDENTITY_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_CLIP_CAPTURE_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_ROUNDED_RESIZE_FIRST_FRAME_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

          .github/scripts/with-headless-wayland.sh env \
            GOO_VK_DIAGNOSTICS=1 \
            GOO_IMAGE_STAGING_SMOKE=1 \
            dotnet tests/Goo.AsyncReadbackSmoke/bin/Release/net10.0/Goo.AsyncReadbackSmoke.dll

      - name: Record dependencies and reject known vulnerabilities
        run: |
          mkdir -p artifacts/reports
          dotnet --info >artifacts/reports/dotnet-info.txt
          dotnet list Goo/Goo.gsproj package --include-transitive --format json \
            >artifacts/reports/dependencies.json
          dotnet list Goo/Goo.gsproj package --vulnerable --include-transitive --format json \
            >artifacts/reports/vulnerabilities.json
          if grep -q '"severity"' artifacts/reports/vulnerabilities.json; then
            cat artifacts/reports/vulnerabilities.json
            exit 1
          fi

      - name: Run focused core behavior tests
        run: |
          .github/scripts/with-headless-wayland.sh env \
            SDL_VIDEODRIVER=wayland \
            LIBGL_ALWAYS_SOFTWARE=1 \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            LD_LIBRARY_PATH="$PWD/artifacts/native${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            dotnet test tests/Goo.CoreBehaviorTests/Goo.CoreBehaviorTests.csproj \
              -c Release -p:TreatWarningsAsErrors=true \
              -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"

      - name: Pack Goo
        run: |
          mkdir -p artifacts/packages
          dotnet pack Goo/Goo.gsproj -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -p:GooWindowsSdlPath="$PWD/artifacts/native/win-x64/SDL3.dll" \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native"
          dotnet pack tools/Goo.SvgCompiler/Goo.SvgCompiler.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"
          dotnet pack Goo.Svg/Goo.Svg.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so" \
            -p:GooWindowsSdlPath="$PWD/artifacts/native/win-x64/SDL3.dll" \
            -p:GooMacOsArm64NativeRoot="$PWD/artifacts/macos-candidate/native"

      - name: Pack Goo DevTools and template
        run: |
          dotnet pack tools/Goo.DevTools.Cli/Goo.DevTools.Cli.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"
          dotnet pack apps/Goo.DevTools/Goo.DevTools.gsproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA" \
            -p:GooLinuxSdlPath="$PWD/artifacts/native/libSDL3.so"
          dotnet pack templates/Goo.Templates/Goo.Templates.csproj \
            -c Release -o artifacts/packages \
            -p:TreatWarningsAsErrors=true \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Validate DevTools package manifests
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ["GOO_VERSION"]
          expected = {
              f"Goo.DevTools.{version}.nupkg": ("Goo.DevTools", "DotnetTool"),
              f"Goo.DevTools.App.{version}.nupkg": ("Goo.DevTools.App", "DotnetTool"),
              f"Goo.Templates.{version}.nupkg": ("Goo.Templates", "Template"),
          }
          root = Path("artifacts/packages")
          for package, (package_id, package_type) in expected.items():
              with ZipFile(root / package) as archive:
                  nuspecs = [name for name in archive.namelist() if name.endswith(".nuspec")]
                  if len(nuspecs) != 1:
                      raise RuntimeError(f"{package}: expected one nuspec, found {nuspecs}")
                  text = archive.read(nuspecs[0]).decode("utf-8")
                  if f'<id>{package_id}</id>' not in text:
                      raise RuntimeError(f"{package}: package id is missing")
                  if f'<packageType name="{package_type}"' not in text:
                      raise RuntimeError(f"{package}: package type is missing")
          PY

      - name: Generate and build Goo template
        run: |
          template_hive="$RUNNER_TEMP/goo-template-hive"
          template_output="$RUNNER_TEMP/goo-template"
          export NUGET_PACKAGES="$RUNNER_TEMP/goo-template-packages"
          mkdir -p "$template_hive" "$template_output" "$NUGET_PACKAGES"
          dotnet new install \
            "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg" \
            --force --debug:custom-hive "$template_hive"
          dotnet new goo --name Generated --output "$template_output" \
            --debug:custom-hive "$template_hive"
          dotnet restore "$template_output/Generated.gsproj" \
            --configfile tests/Goo.PackageSmoke/NuGet.config
          dotnet build "$template_output/Generated.gsproj" \
            -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Install packed Goo developer tools
        run: |
          tool_path="$RUNNER_TEMP/goo-tools"
          mkdir -p "$tool_path"
          dotnet tool install Goo.DevTools \
            --tool-path "$tool_path" \
            --version "$GOO_VERSION" \
            --add-source "$PWD/artifacts/packages"
          dotnet tool install Goo.DevTools.App \
            --tool-path "$tool_path" \
            --version "$GOO_VERSION" \
            --add-source "$PWD/artifacts/packages"
          test "$("$tool_path/goo" --version)" = "$GOO_VERSION"
          test -x "$tool_path/goo-devtools"
          dotnet tool list --tool-path "$tool_path" \
            | grep -F "goo.devtools "
          dotnet tool list --tool-path "$tool_path" \
            | grep -F "goo.devtools.app "

      - name: Publish clean package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/goo-nuget-packages
        run: |
          rm -rf "$NUGET_PACKAGES" artifacts/publish artifacts/linux-x64 artifacts/symbols
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r linux-x64 --self-contained false \
            -p:UseAppHost=false \
            --configfile tests/Goo.PackageSmoke/NuGet.config \
            -o artifacts/publish

      - name: Publish and run clean NativeAOT consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/goo-nativeaot-packages
        run: |
          rm -rf "$NUGET_PACKAGES" artifacts/publish-nativeaot
          dotnet publish tests/Goo.PackageSmoke/Goo.PackageSmoke.gsproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishAot=true \
            --configfile tests/Goo.PackageSmoke/NuGet.config \
            -o artifacts/publish-nativeaot
          artifacts/publish-nativeaot/Goo.PackageSmoke

      - name: Stage minimal Linux bundle and separate symbols
        run: |
          .github/scripts/stage-linux-x64.sh \
            artifacts/publish artifacts/linux-x64 artifacts/symbols

      - name: Validate package, native ABI, checksums, and 20 MiB bundle
        run: |
          .github/scripts/validate-release.py \
            --package "artifacts/packages/Goo.$GOO_VERSION.nupkg" \
            --symbols "artifacts/packages/Goo.$GOO_VERSION.snupkg" \
            --bundle artifacts/linux-x64
          dotnet artifacts/linux-x64/Goo.PackageSmoke.dll

      - name: Archive release candidates
        run: |
          tar -C artifacts -czf "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz" linux-x64
          sha256sum "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz" \
            >"artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz.sha256"


      - name: Upload release validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: goo-${{ env.GOO_VERSION }}-linux-x64
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Svg.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.SvgCompiler.${{ env.GOO_VERSION }}.nupkg
            artifacts/linux-x64/
            artifacts/reports/

      - name: Upload symbols separately
        uses: actions/upload-artifact@v7
        with:
          name: goo-${{ env.GOO_VERSION }}-symbols
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.snupkg
            artifacts/symbols/

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-candidates
          if-no-files-found: error
          path: |
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.${{ env.GOO_VERSION }}.snupkg
            artifacts/packages/Goo.Svg.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.SvgCompiler.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.DevTools.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.DevTools.App.${{ env.GOO_VERSION }}.nupkg
            artifacts/packages/Goo.Templates.${{ env.GOO_VERSION }}.nupkg
            artifacts/Goo.${{ env.GOO_VERSION }}-linux-x64.tar.gz
            artifacts/Goo.${{ env.GOO_VERSION }}-linux-x64.tar.gz.sha256
            artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz
            artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz.sha256
            artifacts/macos-candidate/install-goo-gallery-macos.sh

  release-goo:
    if: github.repository == 'obselate/goo' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load release version
        run: echo "GOO_VERSION=$(python3 .github/scripts/release_version.py --print)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GOO_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$GITHUB_REF_NAME" = "v$GOO_VERSION"
          python3 .github/scripts/release_version.py --check
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download release candidates
        uses: actions/download-artifact@v8
        with:
          name: release-candidates
          path: artifacts

      - name: Download Android adapter package
        uses: actions/download-artifact@v8
        with:
          name: android-package
          path: artifacts/packages

      - name: Require NuGet trusted-publishing identity
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"

      - name: Get temporary NuGet API key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish Goo developer packages to NuGet.org
        run: |
          dotnet nuget push "artifacts/packages/Goo.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Android.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.$GOO_VERSION.snupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.SvgCompiler.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Svg.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.DevTools.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.DevTools.App.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GOO_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          assets=(
            "artifacts/packages/Goo.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.$GOO_VERSION.snupkg"
            "artifacts/packages/Goo.Android.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Svg.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.SvgCompiler.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.DevTools.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.DevTools.App.$GOO_VERSION.nupkg"
            "artifacts/packages/Goo.Templates.$GOO_VERSION.nupkg"
            "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz"
            "artifacts/Goo.$GOO_VERSION-linux-x64.tar.gz.sha256"
            "artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz"
            "artifacts/macos-candidate/Goo.Gallery-macos-arm64.tar.gz.sha256"
            "artifacts/macos-candidate/install-goo-gallery-macos.sh"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              "${release_flags[@]}" \
              --verify-tag \
              --title "Goo $GOO_VERSION" \
              --notes-file CHANGELOG.md
          fi

  android:
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android and native toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
          dotnet workload install android
      - name: Download main package for Android consumer validation
        uses: actions/download-artifact@v8
        with:
          name: release-candidates
          path: artifacts/main-release
      - name: Rebuild and verify Android native payloads
        run: |
          for rid in android-arm64 android-x64; do
            bash .github/scripts/build-text-native-android.sh "$rid" "Goo/Runtime/Vulkan/$rid" "$ANDROID_HOME/ndk/27.2.12479018"
            bash .github/scripts/build-text-native-android.sh "$rid" "artifacts/android-rebuild/$rid" "$ANDROID_HOME/ndk/27.2.12479018"
            diff -qr "Goo/Runtime/Vulkan/$rid" "artifacts/android-rebuild/$rid"
          done
      - name: Build shared desktop scene and Android adapter
        run: |
          dotnet build tests/Goo.AndroidSmoke.Desktop/Goo.AndroidSmoke.Desktop.gsproj -c Release -p:TreatWarningsAsErrors=true
          dotnet build tests/Goo.AndroidSmoke/Goo.AndroidSmoke.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
      - name: Pack Android adapter
        run: dotnet pack Goo.Android/Goo.Android.csproj -c Release --no-build -o artifacts/android-packages -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: artifacts/android-packages/*.nupkg
      - name: Verify Release APK and AAB payloads
        run: |
          python3 .github/scripts/validate-android-package.py tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
          python3 .github/scripts/validate-android-package.py tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 tests/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
      - name: Build clean Android package consumer
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/artifacts/android-consumer-cache
        run: |
          cp artifacts/main-release/packages/Goo.*.nupkg artifacts/android-packages/
          python3 - <<'PYCONFIG'
          import shutil
          from pathlib import Path
          source = Path('artifacts/android-packages').resolve()
          Path('artifacts/android-nuget.config').write_text(f'<configuration><packageSources><clear/><add key="local" value="{source}"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><packageSourceMapping><packageSource key="local"><package pattern="Goo"/><package pattern="Goo.Android"/></packageSource><packageSource key="nuget.org"><package pattern="*"/></packageSource></packageSourceMapping></configuration>')
          consumer = Path('artifacts/android-consumer')
          for name in ['Goo.AndroidSmoke', 'Goo.AndroidSmoke.Shared']:
              shutil.copytree(Path('tests') / name, consumer / name, ignore=shutil.ignore_patterns('bin', 'obj'))
          font = Path('Goo.VulkanProof/Assets/Text/VendSans-VariableFont_wght.ttf')
          (consumer / font).parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(Path('tests') / font, consumer / font)
          PYCONFIG
          dotnet build artifacts/android-consumer/Goo.AndroidSmoke/Goo.AndroidSmoke.csproj -c Release -p:GooSmokeUsePackages=true -p:RestoreConfigFile="$PWD/artifacts/android-nuget.config" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TreatWarningsAsErrors=true
          python3 .github/scripts/validate-android-package.py artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
          python3 .github/scripts/validate-android-package.py artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 artifacts/android-consumer/Goo.AndroidSmoke/bin/Release/net10.0-android/org.goo.androidsmoke-Signed.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: |
            tests/Goo.AndroidSmoke/bin/Release/net10.0-android/*.apk
            tests/Goo.AndroidSmoke/bin/Release/net10.0-android/*.aab
            Goo/Runtime/Vulkan/android-*/text-native-build.json
