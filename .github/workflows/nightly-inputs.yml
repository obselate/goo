name: Nightly inputs

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [svg, raster, native-image, wav, font, text, tree, pointer]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json


      - name: Build input target
        run: nice -n 10 dotnet run --project tools/Goo.HostChecks -c Release -- input-build '${{ matrix.target }}'

      - name: Generate and test inputs for ten minutes
        run: nice -n 10 tools/Goo.InputFuzz/run.sh '${{ matrix.target }}'

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: input-failures-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/input-fuzz/failures/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
